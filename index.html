        const from = segments[idx].at(-1), missing = s[0].i - from.i - 1;
        const label = escapeHtml(`${missing} ${_biPeriod}${missing === 1 ? '' : 's'} not logged|No data between ${from.label} and ${s[0].label}`);
        return `<path class="bi-trend-gap" d="M ${at(from)} L ${at(s[0])}" style="stroke:${color}"></path>
          <line class="bi-chart-hit" x1="${x(from.i)}" y1="${y(from.v)}" x2="${x(s[0].i)}" y2="${y(s[0].v)}" stroke="transparent" stroke-width="16" data-tooltip="${label}"></line>`;
      }).join('');
      const grid = [0,.5,1].map(frac => {
        const gy = T + frac * (H-T-B);
        const gv = max - frac * range;
        return `<line class="bi-grid-line" x1="${L}" y1="${gy}" x2="${W-R}" y2="${gy}"></line>
          <text class="bi-axis-label" x="${L-7}" y="${gy+3}" text-anchor="end">${valFmt(gv)}</text>`;
      }).join('');
      // Where the scale crosses zero, mark it — the sign of a calorie deficit is
      // the whole story, and it is invisible against an arbitrary gridline.
      const zeroRule = min < 0 && max > 0
        ? `<line class="bi-grid-line" x1="${L}" y1="${y(0).toFixed(1)}" x2="${W-R}" y2="${y(0).toFixed(1)}" stroke-opacity=".85"></line>
           <text class="bi-axis-label" x="${L-7}" y="${(y(0)+3).toFixed(1)}" text-anchor="end">0</text>` : '';
      // A reference line turns "here is a squiggle" into "here is where you sit
      // versus normal". Median, so one freak period does not move the baseline.
      // The value is named in the card header — anywhere inside a 640×190 plot
      // it collides with the line it is meant to be read against.
      // A target supersedes the median: two dashed rules in one plot is a riddle,
      // and when there is a goal the goal is the reference that matters.
      const refLine = (cls, value, text) => {
        const ry = y(value);
        // Keep the label inside the canvas when the rule sits at the very edge.
        const ty = Math.min(H - B - 1, Math.max(T + 7, ry + 2.5));
        return `<line class="${cls}" x1="${L}" y1="${ry.toFixed(1)}" x2="${W-R}" y2="${ry.toFixed(1)}"></line>
          <text class="bi-ref-label ${cls}-label" x="${W-R+6}" y="${ty.toFixed(1)}" text-anchor="start">${escapeHtml(text)}</text>`;
      };
      const median = medianOf(data, key);
      const baseline = target != null && target >= min && target <= max
        ? refLine('bi-target', target, `goal ${valFmt(target)}`)
        : points.length < 4 || median == null ? ''
        : refLine('bi-baseline', median, `median ${valFmt(median)}`);
      const labelIndexes = [...new Set([0, Math.floor((data.length-1)/2), data.length-1])];
      const labels = labelIndexes.map(i => `<text class="bi-axis-label" x="${x(i)}" y="${H-6}" text-anchor="${i===0?'start':i===data.length-1?'end':'middle'}">${escapeHtml(getLabel(data[i]))}</text>`).join('');
      const dots = points.map((p, idx) => {
        const periodLabel = _biPeriod === 'week' ? `Week of ${p.label}` : p.label;
        const tooltip = escapeHtml(`${periodLabel}|${valFmt(p.v)}${unit ? ` ${unit}` : ''}`);
        return `<circle class="bi-trend-dot" cx="${x(p.i)}" cy="${y(p.v)}" r="${idx===points.length-1?4:2.5}" style="fill:${color}"></circle><circle class="bi-chart-hit" cx="${x(p.i)}" cy="${y(p.v)}" r="10" data-tooltip="${tooltip}"><title>${escapeHtml(periodLabel)}: ${valFmt(p.v)}${unit ? ` ${unit}` : ''}</title></circle>`;
      }).join('');
      return `<svg class="bi-trend-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(key.replaceAll('_',' '))} trend">
        <defs><linearGradient id="grad-${key}-${_biPeriod}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" style="stop-color:${color}" stop-opacity=".9"/><stop offset="1" style="stop-color:${color}" stop-opacity="0"/></linearGradient></defs>
        ${grid}${zeroRule}${baseline}${area}${gaps}${line}${dots}${labels}
      </svg>`;
    }

    const periodData = buildPeriodData();
    const periodLbl  = _biPeriod === 'week' ? 'last 16 weeks' : _biPeriod === 'month' ? 'last 12 months' : 'last 12 quarters';
    const isAgg      = _biPeriod !== 'week';

    // The snapshot represents the current journal week. Eight-week baselines use
    // the most recent logged readings so an incomplete current week stays honest.
    const latestWith = key => [...entries].reverse().find(e => e[key] != null);
    const currentWeek  = entries.at(-1) || {};
    const latestFit    = latestWith('training_hrs');
    const latestStress = latestWith('stress');
    const latestBody   = latestWith('weekly_weight');
    const latestLearn  = latestWith('articles');
    const latestFood   = latestWith('consumed_cals');
    const avgLastLogged = (key, count = 8) => avgOf(entries.filter(e => e[key] != null).slice(-count), key);
    const avgSlp8 = avgLastLogged('slp_score');
    const avgSlpHrs8 = avgLastLogged('slp_hrs');
    const avgHrv8 = avgLastLogged('slp_hrv');
    const avgRhr8 = avgLastLogged('rhr');
    const timeToMinutes = value => {
      const match = String(value || '').match(/^(\d{1,2}):(\d{2})/);
      if (!match) return null;
      let minutes = Number(match[1]) * 60 + Number(match[2]);
      if (minutes < 6 * 60) minutes += 24 * 60;
      return minutes;
    };
    const formatClock = minutes => {
      if (minutes == null) return null;
      const normalized = Math.round(minutes) % (24 * 60);
      const hour24 = Math.floor(normalized / 60);
      const minute = normalized % 60;
      const period = hour24 >= 12 ? 'PM' : 'AM';
      return `${hour24 % 12 || 12}:${String(minute).padStart(2, '0')} ${period}`;
    };
    const loggedSleepTimes = entries.map(e => timeToMinutes(e.avg_sleep_time)).filter(v => v != null).slice(-8);
    const avgSleepTime8 = loggedSleepTimes.length
      ? formatClock(loggedSleepTimes.reduce((sum, value) => sum + value, 0) / loggedSleepTimes.length)
      : null;
    const currentSleepTime = formatClock(timeToMinutes(currentWeek.avg_sleep_time));
    const wkLbl = e => { const d = parseLocalDate(e.week); return `${d.getMonth()+1}/${d.getDate()}`; };

    const sourceByKey = {
      slp_score:'oura.py → Notion', slp_hrs:'oura.py → Notion', avg_sleep_time:'oura.py → Notion',
      slp_hrv:'oura.py → Notion', rhr:'oura.py → Notion',
      training_hrs:'Garmin computer-use → Notion', intensity_mins:'Garmin computer-use → Notion', weekly_weight:'Garmin computer-use → Notion',
      strength_mins:'Garmin computer-use → Notion',
      body_fat:'Garmin computer-use → Notion', stress:'Garmin computer-use → Notion', meditation:'Garmin computer-use → Notion',
      garmin_tdee:'Garmin computer-use → Notion', consumed_cals:'Notion food log',
      avg_protein:'Notion food log', calorie_deficit:'Notion formula',
      articles:'Readwise via oura.py → Notion', podcasts:'Readwise via oura.py → Notion'
    };
    const sourceFor = key => sourceByKey[key] || 'Notion journal';

    const previousWith = (key, current) => [...entries].reverse().find(e => e !== current && e[key] != null);
    const deltaValue = value => Number.isInteger(value) ? String(value) : (+value).toFixed(1);
    const delta = (key, current, inverse = false, suffix = '', unit = '') => {
      if (!current || current[key] == null) return `<span class="bi-delta" data-tooltip="Comparison|No current value is logged" title="No current value is logged">No trend</span>`;
      const prev = previousWith(key, current);
      if (!prev || prev[key] == null) return `<span class="bi-delta" data-tooltip="Comparison|No previous logged week" title="No previous logged week">First reading</span>`;
      const d = current[key] - prev[key];
      const unitText = unit ? ` ${unit.replace('/ 100','points')}` : suffix;
      const comparison = `Week of ${wkLbl(prev)}|${deltaValue(prev[key])} → ${deltaValue(current[key])}${unitText}`;
      const title = `Compared with previous logged week (${wkLbl(prev)}): ${deltaValue(prev[key])} → ${deltaValue(current[key])}${unitText}`;
      const weekRange = `${wkLbl(prev)}→${wkLbl(current)}`;
      if (Math.abs(d) < .05) return `<span class="bi-delta" data-tooltip="${escapeHtml(comparison)}" title="${escapeHtml(title)}">→ steady · ${weekRange}</span>`;
      const good = inverse ? d < 0 : d > 0;
      const shown = Math.abs(d) >= 10 ? Math.round(Math.abs(d)) : Math.abs(d).toFixed(1);
      return `<span class="bi-delta ${good?'good':'bad'}" data-tooltip="${escapeHtml(comparison)}" title="${escapeHtml(title)}">${d>0?'↑':'↓'} ${shown}${suffix} · ${weekRange}</span>`;
    };
    const card = ({label, key, current, value, unit='', sub, color, inverse=false, suffix='', comparisonLabel=''}) => `
      <div class="bi-summary-card" style="--metric:${color}">
        <div class="bi-summary-top"><div class="bi-summary-label">${label}</div>${comparisonLabel
          ? `<span class="bi-delta" data-tooltip="Context|${escapeHtml(comparisonLabel)}" title="${escapeHtml(comparisonLabel)}">8-wk avg</span>`
          : delta(key, current, inverse, suffix, unit)}</div>
        <div class="bi-summary-value">${value}<span class="bi-summary-unit">${unit}</span></div>
        <div class="bi-summary-sub">${current && current.week ? `Week of ${wkLbl(current)} · ` : ''}${sub}</div>
        <div class="bi-summary-source">Source · ${sourceFor(key)}</div>
      </div>`;

    const chartCard = (label, note, key, color, fmt, zeroBase, unit='', target=null) => {
      const latest = [...periodData].reverse().find(e => e[key] != null);
      const apiHasField = entries.some(e => Object.prototype.hasOwnProperty.call(e, key));
      const chartBody = !apiHasField
        ? `<div class="bi-empty-chart">This metric has not been synced yet</div>`
        : makeTrendChart(periodData, key, color, fmt, zeroBase, unit, target);
      // State how much of the window was actually logged. A sparse metric and a
      // complete one look identical once the line is drawn, and the headline
      // figure is the last *logged* period, which may be months stale.
      const span = trimEmptyEdges(periodData, key);
      const logged = span.filter(e => e[key] != null).length;
      const unitWord = _biPeriod === 'week' ? 'week' : _biPeriod === 'month' ? 'month' : 'quarter';
      // Against a goal, the count of periods that cleared it says more than any
      // average — 106 and 104 are a near miss twice, not "roughly on target".
      // The goal and median values themselves are now labelled on their lines.
      const hits = target == null ? null : span.filter(e => e[key] != null && e[key] >= target).length;
      const medianNote = target != null && logged ? ` · hit ${hits} of ${logged}` : '';
      const coverage = !apiHasField || !logged ? ''
        : logged === periodData.length
          ? `<div class="bi-chart-coverage">All ${periodData.length} ${unitWord}s logged${medianNote}</div>`
          : `<div class="bi-chart-coverage">${logged} of ${periodData.length} ${unitWord}s logged${medianNote}</div>`;
      const asOf = latest && latest !== periodData.at(-1)
        ? `<small class="bi-asof">${unit ? `${unit} · ` : ''}as of ${getLabel(latest)}</small>`
        : unit ? `<small>${unit}</small>` : '';
      return `<article class="bi-chart-card">
        <div class="bi-chart-head">
          <div><div class="bi-chart-label">${label}</div><div class="bi-chart-note">${note}</div><div class="bi-source">Source · ${sourceFor(key)}</div>${coverage}</div>
          <div class="bi-chart-current">${latest ? fmt(latest[key]) : '—'}${asOf}</div>
        </div>
        ${chartBody}
      </article>`;
    };

    // === Lead band: what actually moved ===
    // Sixteen charts of equal weight say nothing on their own. Rank every metric
    // by how far its latest reading sits from its own recent median and let the
    // top three lead the page; the grid below is then detail, not a hunt.
    const MOVER_METRICS = [
      {key:'slp_score',     label:'Sleep score',   fmt:fmtInt, unit:'',     inverse:false, hue:'sleep'},
      {key:'slp_hrs',       label:'Sleep duration',fmt:fmt1,   unit:'hrs',  inverse:false, hue:'sleep'},
      {key:'slp_hrv',       label:'HRV',           fmt:fmtInt, unit:'ms',   inverse:false, hue:'sleep'},
      {key:'rhr',           label:'Resting HR',    fmt:fmtInt, unit:'bpm',  inverse:true,  hue:'sleep'},
      {key:'training_hrs',  label:'Training',      fmt:fmt1,   unit:'hrs',  inverse:false, hue:'body'},
      {key:'intensity_mins',label:'Intensity',     fmt:fmtInt, unit:'min',  inverse:false, hue:'body'},
      {key:'strength_mins', label:'Strength',      fmt:fmtInt, unit:'min',  inverse:false, hue:'body'},
      {key:'weekly_weight', label:'Weight',        fmt:fmt1,   unit:'lbs',  inverse:true,  hue:'body'},

      const vals = pts.map(p => p.v), mn = Math.min(...vals), mx = Math.max(...vals);
      const rg = Math.max(.001, mx - mn), W = 150, H = 30, P = 4;
      const px = i => P + (i / Math.max(1, win.length - 1)) * (W - 2*P);
      const py = v => P + (1 - (v - mn) / rg) * (H - 2*P);
      const runs = pts.reduce((acc, p) => {
        const last = acc.at(-1);
        if (last && p.i === last.at(-1).i + 1) last.push(p); else acc.push([p]);

      return { ...m, latest, value: latest[m.key], baseline, pct };

  // === Mutations ===
  // === Undo / Redo (session-only, in-memory) ===
  const undoMgr = { undo: [], redo: [], suspended: false, MAX: 60 };
  const truncate = (s, n = 28) => { s = (s || 'task').trim(); return s.length > n ? s.slice(0, n) + '…' : s; };
  function flashStatus(msg) { setStatus(msg); setTimeout(() => setStatus(""), 1800); }
  function undoLabelForPatch(patch) {
    const keys = Object.keys(patch);
    if (keys.includes('archived')) return patch.archived ? 'archive' : 'unarchive';
    if (keys.includes('status')) return 'move to ' + (patch.status || '—');
    if (keys.includes('createdAt')) return 'reset staleness';
    if (keys.includes('timing')) return 'change due';
    if (keys.includes('effort')) return 'change effort';
    if (keys.includes('subtasks')) return 'edit subtasks';
    if (keys.includes('title')) return 'edit title';
    if (keys.includes('description')) return 'edit notes';
    if (keys.includes('context')) return 'change context';
    return 'edit';
  }
  function recordUndo(entry) {
    if (undoMgr.suspended) return;
    undoMgr.undo.push(entry);
    if (undoMgr.undo.length > undoMgr.MAX) undoMgr.undo.shift();
    undoMgr.redo.length = 0;  // a fresh action invalidates the redo branch
  }
  async function performUndo() {
    const entry = undoMgr.undo.pop();
    if (!entry) { flashStatus("Nothing to undo"); return; }
    undoMgr.suspended = true;
    try { await entry.undo(); undoMgr.redo.push(entry); flashStatus("Undid: " + entry.label); }
    catch (e) { undoMgr.undo.push(entry); alert("Undo failed: " + e.message); }
    finally { undoMgr.suspended = false; }
  }
  async function performRedo() {
    const entry = undoMgr.redo.pop();
    if (!entry) { flashStatus("Nothing to redo"); return; }
    undoMgr.suspended = true;
    try { await entry.redo(); undoMgr.undo.push(entry); flashStatus("Redid: " + entry.label); }
    catch (e) { undoMgr.redo.push(entry); alert("Redo failed: " + e.message); }
    finally { undoMgr.suspended = false; }
  }

  async function patchTask(id, patch) {
    const idx = state.tasks.findIndex(t => t.id === id);
    if (idx < 0) return;
    const before = state.tasks[idx];
    if (!undoMgr.suspended) {
      const prev = {}, next = { ...patch };
      for (const k of Object.keys(patch)) prev[k] = before[k];
      recordUndo({
        label: undoLabelForPatch(patch),
        undo: () => patchTask(id, prev),
        redo: () => patchTask(id, next),
      });
    }
    const optimistic = { ...before, ...patch, updatedAt: now() };
    if ('createdAt' in patch) optimistic.staleness = computeStaleness(patch.createdAt);
    if ('status' in patch) {
      if (patch.status === 'done' && before.status !== 'done') optimistic.completedAt = now();
      else if (patch.status !== 'done' && before.status === 'done') optimistic.completedAt = null;
    }
    state.tasks[idx] = optimistic;
    afterMutation(id);
    // Focusing a subtask pulls its project into Focus too, so it shows grouped there.
    if (patch.status === 'focus' && before.parentId) {
      const parent = state.tasks.find(t => t.id === before.parentId);
      if (parent && parent.status !== 'focus' && !parent.archived) {
        patchTask(before.parentId, { status: 'focus' });
      }
    }
    try {
      const updated = await updateTaskRow(id, patch);
      state.tasks[idx] = updated;
      afterMutation(id);
    } catch (e) {
      state.tasks[idx] = before;
      afterMutation(id);
      alert("Update failed: " + e.message);
    }
  }

  function afterMutation(id) {
    if (state.filter.needsEffort && untaggedWorkOpenCount() === 0) {
      state.filter.needsEffort = false;
    }
    if (state.view === 'today') {
      renderToday();
    } else if (state.view === 'stats') {
      renderStatsPage();
    } else if (state.view === 'focus') {
      renderFocus();
    } else {
      render();
      renderStatsStrip();
    }
    updateFocusBtnCount();
    if (id && drawerTaskId === id) renderTimestamps();
  }

  async function deleteTask(id) {
    const idx = state.tasks.findIndex(t => t.id === id);
    if (idx < 0) return;
    const removed = state.tasks[idx];
    // Deleting a project cascades its children in the DB (ON DELETE CASCADE).
    const kids = childrenOf(id);
    if (kids.length && !confirm(`Delete "${removed.title}" and its ${kids.length} subtask(s)? This can't be undone.`)) return;
    // Mirror the cascade locally so state doesn't keep orphaned children.
    const removedKids = kids.slice();
    state.tasks = state.tasks.filter(t => t.id !== id && t.parentId !== id);
    if (state.project === id) state.project = null;   // were viewing this project
    if (drawerTaskId === id || removedKids.some(k => k.id === drawerTaskId)) closeDrawer();
    afterMutation();
    try {
      await deleteTaskRow(id);
      if (!kids.length) {
        recordUndo({
          label: `delete "${truncate(removed.title)}"`,
          undo: () => restoreTask(removed),
          redo: () => deleteTask(removed.id),
        });
      }
      // (project deletions aren't undoable — children are gone via cascade)
    } catch (e) {
      state.tasks.splice(idx, 0, removed, ...removedKids);
      afterMutation();
      alert("Delete failed: " + e.message);
    }
  }

  // === Toolbar (group-by + filter pills) ===
  document.getElementById("toolbar").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-value]");
    if (!btn) return;
    const group = btn.closest(".filter-group");
    if (!group) return;
    const key = group.dataset.key;
    if (key === "groupBy") {
      state.groupBy = btn.dataset.value;
      group.querySelectorAll("button[data-value]").forEach(b => {
        b.classList.toggle("active", b === btn);
      });
    } else {
      const wasActive = btn.classList.contains("active");
      if (wasActive) {
        state.filter[key] = "all";
        btn.classList.remove("active");
      } else {
        state.filter[key] = btn.dataset.value;
        group.querySelectorAll("button[data-value]").forEach(b => {
          b.classList.toggle("active", b === btn);
        });
      }
    }
    render();
  });

  // === Toolbar: clear done ===
  async function archiveDoneTasks(done) {
    if (!done.length) return;
    setStatus(`Archiving ${done.length}…`);
    const results = await Promise.allSettled(done.map(t => updateTaskRow(t.id, { archived: true })));
    const succeeded = [];
    done.forEach((t, i) => {
      if (results[i].status === "fulfilled") {
        succeeded.push(t.id);
        const idx = state.tasks.findIndex(x => x.id === t.id);
        if (idx >= 0) state.tasks[idx] = results[i].value;
      }
    });
    setStatus("");
    afterMutation();
    if (succeeded.length) {
      const setArchived = async (val) => {
        for (const id of succeeded) {
          const r = await updateTaskRow(id, { archived: val });
          const i = state.tasks.findIndex(x => x.id === id);
          if (i >= 0) state.tasks[i] = r;
        }
        afterMutation();
      };
      recordUndo({
        label: `archive ${succeeded.length} done`,
        undo: () => setArchived(false),
        redo: () => setArchived(true),
      });
    }
    const failed = results.filter(r => r.status === "rejected").length;
    if (failed) alert(`${failed} task(s) failed to archive`);
  }

  // Inline nudge before archiving: any done Work tasks with no effort would drop out
  // of the weekly capacity points once cleared — offer one-click tagging first.
  function openClearDoneModal(done) {
    const backdrop = document.createElement("div");
    backdrop.className = "cd-backdrop";
    const close = () => { backdrop.remove(); document.removeEventListener("keydown", onKey); };
    const onKey = (e) => { if (e.key === "Escape") close(); };
    // Tasks whose effort still needs tagging (re-derived from live state each render).
    const stillUntagged = () => done.filter(t => {
      const cur = state.tasks.find(x => x.id === t.id) || t;
      return cur.context === "Work" && !cur.effort && !isProject(cur);
    });

    const render = () => {
      const rows = stillUntagged();
      backdrop.innerHTML = `
        <div class="cd-modal" role="dialog" aria-modal="true" aria-label="Tag effort before clearing">
          <h3>${rows.length} of ${done.length} done task${done.length === 1 ? "" : "s"} ${rows.length === 1 ? "has" : "have"} no effort</h3>
          <p class="cd-sub">Tag them so they still count in your capacity stats — or archive anyway.</p>
          <ul class="cd-list">
            ${rows.length ? rows.map(t => `
              <li class="cd-row">
                <span class="cd-row-title">${escapeHtml(t.title) || "<em>Untitled</em>"}</span>
                <span class="effort-pick">${["S","M","L","XL"]
                  .map(e => `<button class="effort-opt" data-set-effort="${e}" data-task="${escapeHtml(t.id)}" title="Set effort ${e}">${e}</button>`).join("")}</span>
              </li>`).join("")
              : `<li class="cd-alldone">All tagged ✓</li>`}
          </ul>
          <div class="cd-actions">
            <button class="cd-cancel" data-cd="cancel">Cancel</button>
            <button class="cd-archive" data-cd="archive">Archive all ${done.length}</button>
          </div>
        </div>`;
    };
    render();

    backdrop.addEventListener("click", (e) => {
      if (e.target === backdrop) return close();            // click outside the card
      const chip = e.target.closest("[data-set-effort]");
      if (chip) { patchTask(chip.dataset.task, { effort: chip.dataset.setEffort }); render(); return; }
      const act = e.target.closest("[data-cd]")?.dataset.cd;
      if (act === "cancel") return close();
      if (act === "archive") { close(); archiveDoneTasks(done); }
    });

    document.addEventListener("keydown", onKey);
    document.body.appendChild(backdrop);
  }

  function openShortcutExplorer() {
    if (document.querySelector('.shortcut-backdrop')) return;
    const isMac = navigator.platform.toUpperCase().includes('MAC');
    const mod = isMac ? '⌘' : 'Ctrl';
    const groups = [
      { label: 'Navigation', rows: [
        { desc: 'Open shortcut explorer', keys: [`${mod}K`] },
        { desc: 'Go to Today / quick-add task', keys: [`${mod}K`, 'then N'] },
        { desc: 'Navigate tasks (board)', keys: ['J', 'K'] },
        { desc: 'Move task to column 1–5', keys: ['1–5'] },
      ]},
      { label: 'Tasks', rows: [
        { desc: 'New task in focused column', keys: ['N'] },
        { desc: 'Open task drawer', keys: ['Enter'] },
        { desc: 'Expand / collapse drawer', keys: ['E'] },
        { desc: 'Close drawer', keys: ['Esc'] },
        { desc: 'Delete focused task', keys: [`${mod}⌫`] },
      ]},
      { label: 'Editing', rows: [
        { desc: 'Undo', keys: [`${mod}Z`] },
        { desc: 'Redo', keys: [`${mod}⇧Z`] },
        { desc: 'Open drawer (alternate)', keys: [`${mod}E`] },
      ]},
      { label: 'Effort (This Week backfill)', rows: [
        { desc: 'Small  (~15 min · 1 pt)', keys: ['S'] },
        { desc: 'Medium (~30 min · 2 pts)', keys: ['M'] },
        { desc: 'Large  (~2 hr  · 5 pts)', keys: ['L'] },
        { desc: 'XL     (~4 hr+ · 10 pts)', keys: ['X'] },
      ]},
    ];

    const renderGroups = (filter) => groups.map(g => {
      const rows = g.rows.filter(r => !filter || r.desc.toLowerCase().includes(filter.toLowerCase()));
      if (!rows.length) return '';
      return `<div class="shortcut-group">
        <div class="shortcut-group-label">${g.label}</div>
        ${rows.map(r => `
          <div class="shortcut-row">
            <span class="shortcut-desc">${r.desc}</span>
            <span class="shortcut-keys">${r.keys.map(k => `<span class="shortcut-key">${k}</span>`).join('')}</span>
          </div>`).join('')}
      </div>`;
    }).join('');

    const backdrop = document.createElement('div');
    backdrop.className = 'shortcut-backdrop';
    backdrop.innerHTML = `
      <div class="shortcut-modal">
        <div class="shortcut-header"><input id="shortcut-search" placeholder="Search shortcuts…" autocomplete="off" /></div>
        <div class="shortcut-body">${renderGroups('')}</div>
        <div class="shortcut-footer"><span>↑↓ navigate</span><span>Esc to close</span><span>${mod}K to toggle</span></div>
      </div>`;

    const close = () => { backdrop.remove(); document.removeEventListener('keydown', onKey); };
    backdrop.addEventListener('click', e => { if (e.target === backdrop) close(); });

    const search = backdrop.querySelector('#shortcut-search');
    const body = backdrop.querySelector('.shortcut-body');
    search.addEventListener('input', () => { body.innerHTML = renderGroups(search.value); });

    const onKey = (e) => {
      if (e.key === 'Escape') { e.stopPropagation(); close(); }
      if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); close(); }
    };
    document.addEventListener('keydown', onKey, { capture: true });
    document.body.appendChild(backdrop);
    setTimeout(() => search.focus(), 30);
  }

  document.getElementById("clear-done").addEventListener("click", () => {
    const done = state.tasks.filter(t => t.status === "done" && !t.archived);
    if (done.length === 0) return;
    const untagged = done.filter(t => t.context === "Work" && !t.effort && !isProject(t));
    if (untagged.length) {
      openClearDoneModal(done);
    } else if (confirm(`Archive ${done.length} completed task${done.length === 1 ? "" : "s"}? They leave the board but stay in your capacity stats.`)) {
      archiveDoneTasks(done);
    }
  });

  document.getElementById("sidebar").addEventListener("click", (e) => {
    // Folder collapse caret — toggle open/closed without selecting.
    const caret = e.target.closest(".folder-caret");
    if (caret) {
      const key = caret.closest("[data-folder]").dataset.folder;
      projectFoldersCollapsed[key] = !projectFoldersCollapsed[key];
      saveFoldersCollapsed();
      renderSidebarProjects();
      return;
    }
    const btn = e.target.closest("button");
    if (!btn) return;

    if (btn.id === 'new-project-btn') { createNewProject(); return; }

    // Context folder: scope the board to Work / Personal.
    if (btn.hasAttribute('data-folder')) {
      const key = btn.dataset.folder;
      if (key !== 'Work' && key !== 'Personal') {   // "No context" only toggles
        projectFoldersCollapsed[key] = !projectFoldersCollapsed[key];
        saveFoldersCollapsed();
        renderSidebarProjects();
        return;
      }
      state.filter.context = key;
      state.project = null;
      state.view = 'board';
      applyView();
      return;
    }

    // Project (data-project; "" = All Tasks). Drill into a project, syncing context.
    if (btn.hasAttribute('data-project')) {
      const pid = btn.dataset.project || null;
      state.project = pid;
      if (!pid) {
        state.filter.context = 'all';                 // All Tasks resets the filter
      } else {
        const p = projectById(pid);
        state.filter.context = (p && p.context) ? p.context : 'all';
      }
      state.view = 'board';
      applyView();
      return;
    }

    // Top-level nav (Today / Stats). Project links still open their scoped board.
    const target = btn.dataset.target;
    if (target === 'today') state.view = 'today';
    else if (target === 'kanban') state.view = (state.view === 'focus') ? 'focus' : 'board';
    else if (target === 'stats') state.view = 'stats';
    else if (target === 'personal-stats') state.view = 'personal-stats';
    else if (target === 'this-week') state.view = 'this-week';
    if (target) applyView();
  });

  document.getElementById("focus-btn").addEventListener("click", () => {
    state.view = (state.view === 'focus') ? 'board' : 'focus';
    applyView();
  });

  document.getElementById("header-ctx").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-context]");
    if (!btn) return;
    const ctx = btn.dataset.context;
    state.filter.context = (state.filter.context === ctx) ? "all" : ctx;
    syncHeaderCtx();
    updateFocusBtnCount();
    renderSidebarProjects();
    if (state.view === 'today') renderToday();
    else if (state.view === 'stats') renderStatsPage();
    else if (state.view === 'focus') renderFocus();
    else { renderStatsStrip(); render(); }
  });

  function syncHeaderCtx() {
    document.querySelectorAll('#header-ctx .ctx-btn').forEach(b => {
      b.classList.toggle('active', b.dataset.context === state.filter.context);
    });
  }

  // === Theme (Light / Dark / System) ===
  const THEME_KEY = 'kanban-theme';
  const THEME_ICON = { system: '🖥️', light: '☀️', dark: '🌙' };
  const THEME_ORDER = ['system', 'light', 'dark'];
  const themeMedia = window.matchMedia ? window.matchMedia('(prefers-color-scheme: dark)') : null;
  function getThemePref() {
    const v = localStorage.getItem(THEME_KEY);
    return THEME_ORDER.includes(v) ? v : 'system';
  }
  function applyTheme() {
    const pref = getThemePref();
    const dark = pref === 'dark' || (pref === 'system' && themeMedia && themeMedia.matches);
    document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
    const btn = document.getElementById('theme-toggle');
    if (btn) {
      btn.textContent = THEME_ICON[pref];
      btn.title = `Theme: ${pref[0].toUpperCase()}${pref.slice(1)}` +
        (pref === 'system' ? ` (${dark ? 'dark' : 'light'})` : '') + ' — click to change';
    }
  }
  function cycleTheme() {
    const next = THEME_ORDER[(THEME_ORDER.indexOf(getThemePref()) + 1) % THEME_ORDER.length];
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    applyTheme();
  }
  (function setupTheme() {
    const btn = document.getElementById('theme-toggle');
    if (btn) btn.addEventListener('click', cycleTheme);
    if (themeMedia) {
      const onChange = () => { if (getThemePref() === 'system') applyTheme(); };
      themeMedia.addEventListener ? themeMedia.addEventListener('change', onChange)
                                  : themeMedia.addListener(onChange);
    }
    applyTheme();
  })();

  // === Keyboard ===
  function isTyping(el) {
    if (!el) return false;
    const tag = el.tagName;
    return tag === "INPUT" || tag === "TEXTAREA" || el.isContentEditable;
  }

  function getFocusedTask() {
    return state.tasks.find(t => t.id === focusedTaskId);
  }

  function moveFocusedToColumn(colId) {
    const task = getFocusedTask();
    if (!task) return;
    const grouping = currentGrouping();
    if (!grouping.droppable) return;
    if (grouping.extract(task) === colId) return;
    if (state.groupBy === "status" && colId === "focus") {
      const ctx = task.context;
      if (focusCountFor(ctx) >= focusCapFor(ctx)) {
        setStatus(`${ctx || "Uncategorized"} Focus cap (${focusCapFor(ctx)}) reached — drop one before adding`);
        setTimeout(() => setStatus(""), 3000);
        return;
      }
    }
    const value = colId === "__none__" ? null : colId;
    patchTask(task.id, { [grouping.field]: value });
  }

  document.addEventListener("keydown", (e) => {
    if (isTyping(e.target)) return;
    if (!currentUser) return;

    const mod = e.metaKey || e.ctrlKey;
    if (mod && e.key.toLowerCase() === "k") {
      e.preventDefault();
      openShortcutExplorer();
      return;
    }
    if (mod && e.key.toLowerCase() === "z") {
      e.preventDefault();
      if (e.shiftKey) performRedo(); else performUndo();
      return;
    }
    if (mod && e.key.toLowerCase() === "y") { e.preventDefault(); performRedo(); return; }

    if (e.key === "ArrowDown" || e.key === "j") { e.preventDefault(); moveFocus(1); return; }
    if (e.key === "ArrowUp"   || e.key === "k") { e.preventDefault(); moveFocus(-1); return; }

    if (e.key === "n" && state.groupBy === "status") {
      e.preventDefault();
      const focused = getFocusedTask();
      const targetCol = focused ? focused.status : "inbox";
      const colEl = board.querySelector(`.col[data-status="${targetCol}"]`);
      if (colEl) openNewInput(targetCol, colEl);
      return;
    }

    if (e.key === "Enter" || ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "e")) {
      const task = getFocusedTask();
      if (!task) return;
      e.preventDefault();
      openDrawer(task.id);
      return;
    }

    if (e.key.toLowerCase() === "e" && !e.metaKey && !e.ctrlKey && drawerTaskId) {
      e.preventDefault();
      toggleDrawerExpand();
      return;
    }

    if (e.key === "Escape" && drawerTaskId) {
      e.preventDefault();
      closeDrawer();
      return;
    }

    if ((e.metaKey || e.ctrlKey) && e.key === "Backspace") {
      e.preventDefault();
      const task = getFocusedTask();
      if (!task) return;
      if (confirm(`Delete "${task.title}"?`)) deleteTask(task.id);
      return;
    }

    if (!e.metaKey && !e.ctrlKey && !e.altKey && /^[1-5]$/.test(e.key)) {
      const grouping = currentGrouping();
      const col = grouping.columns[parseInt(e.key, 10) - 1];
      if (!col || !grouping.droppable) return;
      e.preventDefault();
      moveFocusedToColumn(col.id);
      return;
    }
  });

  setupDrawer();
  setupToday();
  initAuth();
})();
</script>
</body>
</html>
