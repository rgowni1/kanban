    const focusedProjectIds = new Set(focus.filter(isProject).map(t => t.id));
    const poolTasks = state.tasks.filter(t =>
      !t.archived && inContext(t) && t.status !== 'focus' && t.status !== 'done' && !isProject(t));
    // Standalone tasks render flat; subtasks group under their project.
    const standalone = poolTasks.filter(t => !t.parentId).sort(byDueThenStatus);
    const byParent = new Map();
    for (const t of poolTasks) {
      if (!t.parentId) continue;
      (byParent.get(t.parentId) || byParent.set(t.parentId, []).get(t.parentId)).push(t);
    }
    const projectGroups = [...byParent.keys()]
      .map(pid => ({ project: state.tasks.find(p => p.id === pid), kids: byParent.get(pid).sort(byDueThenStatus) }))
      .filter(g => g.project)
      .sort((a, b) => (a.project.title || '').localeCompare(b.project.title || ''));

    const dateStr = new Date().toLocaleDateString(undefined, { weekday: 'long', month: 'short', day: 'numeric' });
    const dot = (t) =>
      t.context === 'Work' ? `<span class="ctx-ico" title="Work">💼</span>`
      : t.context === 'Personal' ? `<span class="ctx-ico" title="Personal">🏠</span>`
      : `<span class="ctx-ico ctx-none" title="No context">·</span>`;
    const dueChip = (t) => t.timing
      ? `<span class="today-due${t.timing === 'this-week' ? ' now' : ''}">${escapeHtml(TIMING_LABEL[t.timing] || t.timing)}</span>`
      : '';
    // Effort tag so sizing is visible without opening the drawer. Unsized tasks show "?".
    const effChip = (t) => {
      const e = ['S','M','L','XL'].includes(t.effort) ? t.effort : null;
      return `<span class="today-eff${e ? ` today-eff-${e}` : ''}" title="${e ? `${e} · ${POINTS[e]} pt${POINTS[e] === 1 ? '' : 's'}` : 'No estimate'}">${e || '?'}</span>`;
    };

    const parentTitleOf = (t) => {
      if (!t.parentId) return null;
      const p = state.tasks.find(x => x.id === t.parentId);
      return p ? p.title : null;
    };
    const focusCard = (t) => {
      const par = parentTitleOf(t);
      return `
      <li class="today-card focus" draggable="true" data-task-id="${escapeHtml(t.id)}" data-move-available="${escapeHtml(t.id)}" title="Click or drag to Available">
        <span class="today-check" data-toggle="${escapeHtml(t.id)}" title="Mark done"></span>
        ${dot(t)}<span class="today-card-title">${par ? `<span class="today-bc">${escapeHtml(par)} › </span>` : ''}${escapeHtml(t.title) || '<em>Untitled</em>'}</span>
        ${effChip(t)}
        <button class="today-move" draggable="false" data-move-available="${escapeHtml(t.id)}" title="Move to Available" aria-label="Move to Available">→</button>
        <button class="today-edit" data-open="${escapeHtml(t.id)}" title="Open details">✎</button>
        <button class="today-del" data-del="${escapeHtml(t.id)}" title="Delete task">×</button>
      </li>`;
    };
    const poolCard = (t) => `
      <li class="today-card${t.parentId ? ' subtask' : ''}" draggable="true" data-task-id="${escapeHtml(t.id)}" data-move-focus="${escapeHtml(t.id)}" title="Click or drag to Focus">
        <span class="today-check" data-toggle="${escapeHtml(t.id)}" title="Mark done"></span>
        ${dot(t)}<span class="today-card-title">${escapeHtml(t.title) || '<em>Untitled</em>'}</span>
        ${effChip(t)}
        ${dueChip(t)}
        <button class="today-move" draggable="false" data-move-focus="${escapeHtml(t.id)}" title="Move to Focus" aria-label="Move to Focus">←</button>
        <button class="today-edit" data-open="${escapeHtml(t.id)}" title="Open details">✎</button>
        <button class="today-del" data-del="${escapeHtml(t.id)}" title="Delete task">×</button>
      </li>`;
    const groupHeader = (g, collapsed) => {
      const pts = projectEffortPoints(g.project.id);
      return `
      <li class="today-group" data-open="${escapeHtml(g.project.id)}" title="Open project to edit">
        <span class="today-group-caret" data-toggle-group="${escapeHtml(g.project.id)}" title="${collapsed ? 'Expand' : 'Collapse'}">${collapsed ? '▸' : '▾'}</span>
        <span class="today-group-name">📁 ${escapeHtml(g.project.title)}</span>
        <span class="today-group-count">${g.kids.length}${pts ? ` · ${pts} pts` : ''}</span>
        <button class="today-del" data-del="${escapeHtml(g.project.id)}" title="Delete project + its subtasks">×</button>
      </li>`;
    };

    // A project in Focus: show the project as a header card with its open subtasks nested beneath.
    const projectFocusCard = (t) => {
      const { done, total } = projectProgress(t.id);
      const pts = projectEffortPoints(t.id);
      return `
      <li class="today-card focus today-proj-focus" draggable="true" data-task-id="${escapeHtml(t.id)}" data-move-available="${escapeHtml(t.id)}" title="Click or drag project to Available">
        <span class="ctx-ico">📁</span><span class="today-card-title">${escapeHtml(t.title) || '<em>Untitled</em>'}</span>
        ${pts ? `<span class="today-due">${pts} pts</span>` : ''}
        <span class="today-due">${done}/${total}</span>
        <button class="today-move" draggable="false" data-move-available="${escapeHtml(t.id)}" title="Move project to Available" aria-label="Move project to Available">→</button>
        <button class="today-edit" data-open="${escapeHtml(t.id)}" title="Open project">✎</button>
        <button class="today-del" data-del="${escapeHtml(t.id)}" title="Delete project + subtasks">×</button>
      </li>`;
    };
    const focusChildCard = (t) => `
      <li class="today-card subtask focus-child" draggable="true" data-task-id="${escapeHtml(t.id)}" data-move-available="${escapeHtml(t.id)}" title="Click or drag to Available">
        <span class="today-check" data-toggle="${escapeHtml(t.id)}" title="Mark done"></span>
        ${dot(t)}<span class="today-card-title">${escapeHtml(t.title) || '<em>Untitled</em>'}</span>
        ${effChip(t)}
        <button class="today-move" draggable="false" data-move-available="${escapeHtml(t.id)}" title="Move to Available" aria-label="Move to Available">→</button>
        <button class="today-edit" data-open="${escapeHtml(t.id)}" title="Open details">✎</button>
        <button class="today-del" data-del="${escapeHtml(t.id)}" title="Delete task">×</button>
      </li>`;
    // Don't list a focused subtask at the top level if its project is also focused —
    // it already shows nested under that project below.
    // Only genuinely focused children appear under a focused project. Unfocused
    // siblings stay in Available so every visible card can move independently.
    const focusNested = (pid) => {
      return childrenOf(pid).filter(c => c.status === 'focus').sort(byDueThenStatus);
    };
    // Projects with no focused children are excluded from Focus — an empty project
    // card is noise. They stay in Available until a child task is also focused.
    const focusTop = focus.filter(t =>
      !(t.parentId && focusedProjectIds.has(t.parentId)) &&
      !(isProject(t) && focusNested(t.id).length === 0)
    );
    const focusBody = focusTop.length
      ? focusTop.map(t => isProject(t)
          ? projectFocusCard(t) + focusNested(t.id).map(focusChildCard).join('')
          : focusCard(t)).join('')
      : `<li class="today-empty">Pick from the right → to focus on it today.</li>`;

    const poolCount = poolTasks.length;
    const poolBody = poolCount
      ? standalone.map(poolCard).join('')
        + projectGroups.map(g => {
            const collapsed = !!availCollapsed[g.project.id];
            return groupHeader(g, collapsed) + (collapsed ? '' : g.kids.map(poolCard).join(''));
          }).join('')
      : `<li class="today-empty">Nothing waiting — add one above. 🎉</li>`;

    root.innerHTML = `
      <div class="today-wrap">
        <div class="today-head">
          <h2 class="today-title">Today</h2>
          <span class="today-date">${escapeHtml(dateStr)}</span>
        </div>
        ${effortLegendHtml()}
        <div class="today-grid">
          <section class="today-pane" data-today-drop="focus">
            <div class="today-pane-head"><span>Focus</span><span class="today-pane-head-right"><span class="today-drop-hint">Drop to focus</span><span class="today-pane-count${focusIsOver(ctx, focus.length) ? ' over' : ''}">${escapeHtml(focusCountLabel(ctx, focus.length))}</span></span></div>
            <ul class="today-list">${focusBody}</ul>
          </section>
          <section class="today-pane" data-today-drop="available">
            <div class="today-add">
              <input id="today-add-input" type="text" placeholder="+ Add a task…" autocomplete="off" />
              <div class="today-add-row" id="today-add-row" hidden>
                <select id="add-context" class="today-add-sel">
                  <option value="">Context…</option>
                  <option value="Work">💼 Work</option>
                  <option value="Personal">🏠 Personal</option>
                </select>
                <select id="add-due" class="today-add-sel">
                  <option value="">Due…</option>
                  <option value="this-week">This Week</option>
                  <option value="next-week">Next Week</option>
                  <option value="next-30-days">Later</option>
                  <option value="ongoing">Ongoing</option>
                </select>
                <select id="add-effort" class="today-add-sel">
                  <option value="">Effort…</option>
                  <option value="S">S</option>
                  <option value="M">M</option>
                  <option value="L">L</option>
                  <option value="XL">XL</option>
                </select>
                <select id="add-project" class="today-add-sel"><option value="">No project</option></select>
                <button id="add-confirm" class="today-add-btn">Add</button>
              </div>
            </div>
            <div class="today-pane-head"><span>Available</span><span class="today-pane-head-right"><span class="today-drop-hint">Drop to defer</span><span class="today-pane-count">${poolCount}</span></span></div>
            <ul class="today-list">${poolBody}</ul>
          </section>
        </div>
      </div>`;
    syncTodayAddForm();
  }

  function renderThisWeek() {
    const root = document.getElementById('this-week-view');
    const weekStart = new Date(); weekStart.setHours(0,0,0,0);
    weekStart.setDate(weekStart.getDate() - ((weekStart.getDay() + 6) % 7)); // Monday
    const weekDone = state.tasks
      .filter(t => t.status === 'done' && !t.archived && t.completedAt && new Date(t.completedAt) >= weekStart)
      .sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt));

    const fmtTime = ts => new Date(ts).toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
    const fmtDay = ts => {
      const d = new Date(ts); const t = new Date();
      if (d.toDateString() === t.toDateString()) return 'Today';
      return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
    };
    const totalPts = weekDone.reduce((s, t) => s + (POINTS[t.effort] || 0), 0);

    const effortPicker = (task) => `
      <div class="tw-effort-picker" data-id="${escapeHtml(task.id)}">
        <span class="tw-effort-label">Add effort:</span>
        ${['S','M','L','XL'].map(e => `
          <button class="tw-effort-btn" data-effort="${e}" data-task-id="${escapeHtml(task.id)}" title="${EFFORT_LABELS[e]} · ${EFFORT_HINTS[e]}">
            <span class="tw-effort-key">${e}</span><span class="tw-effort-full">${EFFORT_LABELS[e]}</span><span class="tw-effort-hint"> · ${EFFORT_HINTS[e]}</span>
          </button>`).join('')}
      </div>`;

    const items = weekDone.map(task => {
      const pills = [];
      if (task.context) {
        const cls = task.context === 'Work' ? 'ctx-work' : 'ctx-personal';
        pills.push(`<span class="tw-pill ${cls}">${escapeHtml(task.context)}</span>`);
      }
      if (task.effort) {
        const pts = POINTS[task.effort] || 0;
        pills.push(`<span class="tw-pill effort">${escapeHtml(task.effort)} · ${pts}pt${pts === 1 ? '' : 's'}</span>`);
      }
      pills.push(`<span class="tw-pill time">${fmtDay(task.completedAt)} ${fmtTime(task.completedAt)}</span>`);
      return `
        <li class="tw-item" data-id="${escapeHtml(task.id)}">
          <span class="tw-check">✓</span>
          <span class="tw-title-text">${escapeHtml(task.title)}</span>
          <div class="tw-pills">${pills.join('')}</div>
        </li>
        ${!task.effort ? effortPicker(task) : ''}`;
    }).join('');

    const emptyMsg = `<li style="padding:20px;color:var(--muted);font-size:14px">No tasks completed this week yet.</li>`;

    root.innerHTML = `
      <div class="tw-wrap">
        <div class="tw-head">
          <div class="tw-title">This Week</div>
          <div class="tw-subtitle">${weekDone.length} completed · ${totalPts} points</div>
        </div>
        <ul class="tw-list">${weekDone.length ? items : emptyMsg}</ul>
      </div>`;

    root.querySelectorAll('.tw-item').forEach(el => {
      el.addEventListener('click', () => openDrawer(el.dataset.id));
    });
    root.querySelectorAll('.tw-effort-btn').forEach(btn => {
      btn.addEventListener('click', async (e) => {
        e.stopPropagation();
        await patchTask(btn.dataset.taskId, { effort: btn.dataset.effort });
        renderThisWeek();
      });
    });
  }

  // Restore the inline add-form's open state + selections after each render,
  // and populate the project list for the chosen context.
  function syncTodayAddForm() {
    const row = document.getElementById('today-add-row');
    if (!row) return;
    row.hidden = !todayAdd.open;
    const ctxSel = document.getElementById('add-context');
    const dueSel = document.getElementById('add-due');
    const effSel = document.getElementById('add-effort');
    const projSel = document.getElementById('add-project');
    ctxSel.value = todayAdd.context;
    dueSel.value = todayAdd.due;
    effSel.value = todayAdd.effort;
    const opts = ['<option value="">No project</option>'];
    // Eligible parents = any top-level, open task — NOT just ones that already
    // have children. This lets you file the first task under a brand-new project
    // (isProject() requires ≥1 child, so empty projects wouldn't appear otherwise).
    state.tasks
      .filter(p => !p.parentId && !p.archived && p.status !== 'done'
        && (!todayAdd.context || p.context === todayAdd.context))
      .sort((a, b) => (a.title || '').localeCompare(b.title || ''))
      .forEach(p => opts.push(`<option value="${p.id}">${escapeHtml(p.title)}</option>`));
    projSel.innerHTML = opts.join('');
    if (!projSel.querySelector(`option[value="${todayAdd.project}"]`)) todayAdd.project = '';
    projSel.value = todayAdd.project;
  }

  function promoteToFocus(id) {
    const t = state.tasks.find(x => x.id === id);
    if (!t) return;
    if (focusCountFor(t.context) >= focusCapFor(t.context)) {
      flashStatus(`${t.context || 'Uncategorized'} Focus is full (${focusCapFor(t.context)}) — finish or drop one first`);
      return;
    }
    patchTask(id, { status: 'focus' });   // patchTask auto-sets timing=today for focus
  }

  async function submitTodayAdd() {
    const input = document.getElementById('today-add-input');
    const v = (input?.value || '').trim();
    if (!v) return;
    const ctx = todayAdd.context
      || (state.filter.context === 'Work' || state.filter.context === 'Personal' ? state.filter.context : 'Personal');
    try {
      const created = await createTaskRow({
        title: v, status: 'not-started', source: 'Manual',
        context: ctx,
        timing: todayAdd.due || undefined,
        effort: todayAdd.effort || undefined,
        parentId: todayAdd.project || undefined,
      });
      state.tasks.unshift(created);
      afterMutation();   // re-renders Today; syncTodayAddForm restores the open form + sticky selections
      recordUndo({
        label: `add "${truncate(created.title)}"`,
        undo: () => deleteTask(created.id),
        redo: () => restoreTask(created),
      });
      const inp = document.getElementById('today-add-input');
      if (inp) { inp.value = ''; inp.focus(); }
    } catch (e) {
      alert('Could not add task: ' + e.message);
    }
  }

  function setupToday() {
    const root = document.getElementById('today-view');
    root.addEventListener('click', (e) => {
      if (e.target.closest('#add-confirm')) { submitTodayAdd(); return; }
      const groupCaret = e.target.closest('[data-toggle-group]');
      if (groupCaret) {
        const pid = groupCaret.dataset.toggleGroup;
        availCollapsed[pid] = !availCollapsed[pid];
        saveAvailCollapsed();
        renderToday();
        return;
      }
      const del = e.target.closest('[data-del]');
      if (del) { deleteTask(del.dataset.del); return; }
      const toggle = e.target.closest('[data-toggle]');
      if (toggle) { patchTask(toggle.dataset.toggle, { status: 'done' }); return; }
      const edit = e.target.closest('[data-open]');
      if (edit) { openDrawer(edit.dataset.open); return; }
      const promote = e.target.closest('[data-move-focus]');
      if (promote) { promoteToFocus(promote.dataset.moveFocus); return; }
      const demote = e.target.closest('[data-move-available]');
      if (demote) { patchTask(demote.dataset.moveAvailable, { status: 'in-progress' }); return; }
    });

    const clearTodayDrag = () => {
      todayDragId = null;
      root.classList.remove('is-dragging');
      root.querySelectorAll('.today-card.dragging, .today-pane.drag-over').forEach(el => {
        el.classList.remove('dragging', 'drag-over');
      });
    };
    root.addEventListener('dragstart', (e) => {
      const card = e.target.closest('.today-card[data-task-id]');
      if (!card || e.target.closest('button, [data-toggle]')) {
        e.preventDefault();
        return;
      }
      todayDragId = card.dataset.taskId;
      e.dataTransfer.setData('text/plain', todayDragId);
      e.dataTransfer.effectAllowed = 'move';
      card.classList.add('dragging');
      root.classList.add('is-dragging');
    });
    root.addEventListener('dragend', clearTodayDrag);
    root.addEventListener('dragover', (e) => {
      const pane = e.target.closest('[data-today-drop]');
      if (!pane || !todayDragId) return;
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      root.querySelectorAll('.today-pane.drag-over').forEach(el => {
        if (el !== pane) el.classList.remove('drag-over');
      });
      pane.classList.add('drag-over');
    });
    root.addEventListener('dragleave', (e) => {
      const pane = e.target.closest('[data-today-drop]');
      if (pane && !pane.contains(e.relatedTarget)) pane.classList.remove('drag-over');
    });
    root.addEventListener('drop', (e) => {
      const pane = e.target.closest('[data-today-drop]');
      if (!pane) return;
      e.preventDefault();
      const id = e.dataTransfer.getData('text/plain') || todayDragId;
      const task = state.tasks.find(t => t.id === id);
      const destination = pane.dataset.todayDrop;
      clearTodayDrag();
      if (!task) return;
      if (destination === 'focus' && task.status !== 'focus') promoteToFocus(id);
      else if (destination === 'available' && task.status === 'focus') {
        patchTask(id, { status: 'in-progress' });
      }
    });
    // Reveal the inline field row when you start adding; default context from the view.
    root.addEventListener('focusin', (e) => {
      if (e.target.id === 'today-add-input' && !todayAdd.open) {
        todayAdd.open = true;
        if (!todayAdd.context && (state.filter.context === 'Work' || state.filter.context === 'Personal')) {
          todayAdd.context = state.filter.context;
        }
        syncTodayAddForm();
      }
    });
    // Keep the draft in sync as fields change (re-list projects when context changes).
    root.addEventListener('change', (e) => {
      if (e.target.id === 'add-context') { todayAdd.context = e.target.value; todayAdd.project = ''; syncTodayAddForm(); }
      else if (e.target.id === 'add-due') todayAdd.due = e.target.value;
      else if (e.target.id === 'add-effort') todayAdd.effort = e.target.value;
      else if (e.target.id === 'add-project') todayAdd.project = e.target.value;
    });
    // Collapse the field row when focus leaves the add area and the title is empty.
    root.addEventListener('focusout', (e) => {
      const add = e.target.closest('.today-add');
      if (!add) return;
      setTimeout(() => {
        const input = document.getElementById('today-add-input');
        const active = document.activeElement;
        if (todayAdd.open && input && !input.value.trim() && !(active && active.closest('.today-add'))) {
          todayAdd.open = false;
          syncTodayAddForm();
        }
      }, 0);
    });
    root.addEventListener('keydown', (e) => {
      if (e.target.id === 'today-add-input' && e.key === 'Enter') {
        e.preventDefault();
        submitTodayAdd();
      }
    });
  }

  function renderFocus() {
    const root = document.getElementById('focus-view');
    const ctx = state.filter.context;
    const inContext = (t) => ctx === "all" || t.context === ctx;
    // Sync + sort against the FULL focus set so the saved ordering for the
    // hidden context isn't pruned, then narrow to the active context for display.
    const allFocus = state.tasks.filter(t => t.status === 'focus');
    syncFocusOrder(allFocus);
    let focusTasks = sortByFocusOrder(allFocus).filter(inContext);

    const todayStart = new Date();
    todayStart.setHours(0, 0, 0, 0);
    const weekStart = new Date(todayStart);
    weekStart.setDate(todayStart.getDate() - ((todayStart.getDay() + 6) % 7)); // Monday
    const doneTasks = state.tasks
      .filter(t => t.status === 'done' && !t.archived && inContext(t) && t.completedAt && new Date(t.completedAt) >= todayStart)
      .sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt));
    const weekDoneTasks = state.tasks
      .filter(t => t.status === 'done' && !t.archived && t.completedAt && new Date(t.completedAt) >= weekStart)
      .sort((a, b) => new Date(b.completedAt) - new Date(a.completedAt));

    const cardHtml = (task) => {
      const badges = [];
      if (task.timing) {
        const label = TIMING_LABEL[task.timing] || task.timing;
        badges.push(`<span class="badge timing timing-${task.timing}">${escapeHtml(label)}</span>`);
      }
      const st = stalenessOf(task);
      if (st) {
        badges.push(`<span class="badge staleness stale-${st.level}">${escapeHtml(st.label)}</span>`);
      }
      return `
        <li class="focus-card" draggable="true" data-id="${escapeHtml(task.id)}">
          <div class="focus-card-row">
            <div class="focus-card-title">${escapeHtml(task.title)}</div>
            <div class="focus-card-actions" aria-label="Task actions">
              <button class="focus-card-action" data-focus-action="in-progress" title="Return to In Progress" aria-label="Return to In Progress">↙</button>
              <button class="focus-card-action" data-focus-action="done" title="Mark done" aria-label="Mark done">✓</button>
            </div>
          </div>
          ${badges.length ? `<div class="focus-card-badges">${badges.join('')}</div>` : ''}
        </li>
      `;
    };

    const groups = new Map(EFFORT_GROUPS.map(g => [g.key, []]));
    for (const t of focusTasks) {
      const key = ['S','M','L','XL'].includes(t.effort) ? t.effort : null;
      groups.get(key).push(t);
    }

    const focusSectionsHtml = EFFORT_GROUPS.map(g => {
      const tasks = groups.get(g.key);
      const dataEffort = g.key === null ? '' : g.key;
      const body = tasks.length
        ? tasks.map(cardHtml).join('')
        : `<li class="focus-section-empty">drop here</li>`;
      return `
        <div class="focus-section" data-effort="${dataEffort}">
          <div class="focus-section-head">
            <span class="focus-section-label">${g.label}</span>
            <span class="focus-section-count">${tasks.length}</span>
          </div>
          <ul class="focus-list focus-section-list">${body}</ul>
        </div>
      `;
    }).join('');

    const doneList = doneTasks.length
      ? doneTasks.map(t => `
        <li class="focus-card done" draggable="true" data-id="${escapeHtml(t.id)}">
          <div class="focus-card-title">${escapeHtml(t.title)}</div>
        </li>
      `).join('')
      : `<div class="focus-empty">Drag tasks here to complete them.</div>`;

    const weekStreamHtml = (() => {
      if (!weekDoneTasks.length) return '';
      const fmtTime = ts => {
        const d = new Date(ts);
        return d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
      };
      const fmtDay = ts => {
        const d = new Date(ts); const t = new Date();
        if (d.toDateString() === t.toDateString()) return 'Today';
        const days = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
        return days[d.getDay()];
      };
      const items = weekDoneTasks.map(t => `
        <li class="week-stream-item" data-id="${escapeHtml(t.id)}" style="cursor:pointer">
          <span class="week-stream-check">✓</span>
          <span class="week-stream-title-text">${escapeHtml(t.title)}</span>
          ${t.context ? `<span class="week-stream-ctx ${t.context === 'Work' ? 'work' : 'personal'}">${escapeHtml(t.context)}</span>` : ''}
          <span class="week-stream-time">${fmtDay(t.completedAt)} ${fmtTime(t.completedAt)}</span>
        </li>`).join('');
      return `
        <div class="week-stream">
          <div class="week-stream-head">
            <span class="week-stream-title">This Week</span>
            <span class="week-stream-count">${weekDoneTasks.length} completed</span>
          </div>
          <ul class="week-stream-list">${items}</ul>
        </div>`;
    })();

    root.innerHTML = `
      <div class="focus-wrap">
        <div class="focus-grid">
          <div class="focus-col focus-col-todo" data-status="focus">
            <div class="focus-col-head">
              <div class="focus-col-title">Focus</div>
              <div class="focus-col-count">${focusTasks.length} ${focusTasks.length === 1 ? 'task' : 'tasks'}</div>
            </div>
            ${focusCapacityHtml()}
            ${effortLegendHtml('Sections below group by effort')}
            <input id="focus-add-input" class="focus-add-input" type="text" placeholder="+ Add a Focus task…" autocomplete="off" />
            <div class="focus-sections">${focusSectionsHtml}</div>
            <div class="focus-offramp">
              <div class="focus-offramp-label">Move out of Focus</div>
              <div class="focus-offramp-targets">
                <div class="focus-offramp-target" data-move-status="in-progress">
                  <strong>In Progress</strong><span>Keep it active, but not committed today</span>
                </div>
                <div class="focus-offramp-target" data-move-status="not-started">
                  <strong>Not started</strong><span>Return it to the queue</span>
                </div>
              </div>
            </div>
          </div>
          <div class="focus-col focus-col-done" data-status="done">
            <div class="focus-col-head">
              <div class="focus-col-title">Done today</div>
              <div class="focus-col-count">${doneTasks.length}</div>
            </div>
            <ul class="focus-list">${doneList}</ul>
          </div>
        </div>
        ${weekStreamHtml}
      </div>
    `;

    const clearIndicators = () => {
      root.querySelectorAll('.drop-before, .drop-after, .drag-over-section, .drag-over')
        .forEach(el => el.classList.remove('drop-before', 'drop-after', 'drag-over-section', 'drag-over'));
    };

    root.querySelectorAll('.focus-card').forEach(el => {
      const id = el.dataset.id;
      el.addEventListener('dragstart', (e) => {
        e.dataTransfer.setData('text/plain', id);
        e.dataTransfer.effectAllowed = 'move';
        el.classList.add('dragging');
      });
      el.addEventListener('dragend', () => {
        el.classList.remove('dragging');
        clearIndicators();
      });
      el.addEventListener('click', () => {
        if (el.classList.contains('dragging')) return;
        openDrawer(id);
      });
      el.querySelectorAll('[data-focus-action]').forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          patchTask(id, { status: btn.dataset.focusAction });
        });
        btn.addEventListener('mousedown', (e) => e.stopPropagation());
      });
    });

    root.querySelectorAll('.focus-col-todo .focus-card').forEach(el => {
      el.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = 'move';
        const rect = el.getBoundingClientRect();
        const isAbove = (e.clientY - rect.top) < rect.height / 2;
        clearIndicators();
        el.classList.add(isAbove ? 'drop-before' : 'drop-after');
      });
      el.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        const draggedId = e.dataTransfer.getData('text/plain');
        const targetId = el.dataset.id;
        const rect = el.getBoundingClientRect();
        const isAbove = (e.clientY - rect.top) < rect.height / 2;
        const targetEffort = el.closest('.focus-section')?.dataset.effort || null;
        clearIndicators();
        if (!draggedId) return;
        const dragged = state.tasks.find(t => t.id === draggedId);
        if (!dragged) return;
        if (dragged.status !== 'focus') {
          patchTask(draggedId, { status: 'focus' });
          return;
        }
        reorderFocus(draggedId, targetId, isAbove, targetEffort || null);
      });
    });

    root.querySelectorAll('.focus-col-todo .focus-section').forEach(sec => {
      const effort = sec.dataset.effort || null;
      sec.addEventListener('dragover', (e) => {
        if (e.target.closest('.focus-card')) return;
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        sec.classList.add('drag-over-section');
      });
      sec.addEventListener('dragleave', (e) => {
        if (!sec.contains(e.relatedTarget)) sec.classList.remove('drag-over-section');
      });
      sec.addEventListener('drop', (e) => {
        if (e.target.closest('.focus-card')) return;
        e.preventDefault();
        sec.classList.remove('drag-over-section');
        const draggedId = e.dataTransfer.getData('text/plain');
        if (!draggedId) return;
        const dragged = state.tasks.find(t => t.id === draggedId);
        if (!dragged) return;
        if (dragged.status !== 'focus') {
          const patch = { status: 'focus' };
          if (effort !== null) patch.effort = effort;
          patchTask(draggedId, patch);
          return;
        }
        reorderFocus(draggedId, null, false, effort);
      });
    });

    const doneCol = root.querySelector('.focus-col-done');
    doneCol.addEventListener('dragover', (e) => {
      e.preventDefault();
      e.dataTransfer.dropEffect = 'move';
      doneCol.classList.add('drag-over');
    });
    doneCol.addEventListener('dragleave', (e) => {
      if (!doneCol.contains(e.relatedTarget)) doneCol.classList.remove('drag-over');
    });
    doneCol.addEventListener('drop', (e) => {
      e.preventDefault();
      doneCol.classList.remove('drag-over');
      const id = e.dataTransfer.getData('text/plain');
      if (!id) return;
      const task = state.tasks.find(t => t.id === id);
      if (!task || task.status === 'done') return;
      patchTask(id, { status: 'done' });
    });

    root.querySelectorAll('.focus-offramp-target').forEach(target => {
      target.addEventListener('dragover', (e) => {
        e.preventDefault();
        e.dataTransfer.dropEffect = 'move';
        target.classList.add('drag-over');
      });
      target.addEventListener('dragleave', (e) => {
        if (!target.contains(e.relatedTarget)) target.classList.remove('drag-over');
      });
      target.addEventListener('drop', (e) => {
        e.preventDefault();
        e.stopPropagation();
        target.classList.remove('drag-over');
        const id = e.dataTransfer.getData('text/plain');
        const task = state.tasks.find(t => t.id === id);
        if (!task || task.status !== 'focus') return;
        patchTask(id, { status: target.dataset.moveStatus });
      });
    });

    root.querySelectorAll('.week-stream-item').forEach(el => {
      el.addEventListener('click', () => openDrawer(el.dataset.id));
    });

    // Quick-add a Focus task directly in this view (lands in "No estimate" — drag to size it).
    const addInput = root.querySelector('#focus-add-input');
    if (addInput) {
      addInput.addEventListener('keydown', async (e) => {
        if (e.key !== 'Enter') return;
        const v = addInput.value.trim();
        if (!v) return;
        const c = (state.filter.context === 'Work' || state.filter.context === 'Personal') ? state.filter.context : 'Personal';
        if (focusCountFor(c) >= focusCapFor(c)) {
          flashStatus(`${c} Focus is full (${focusCapFor(c)}) — finish or drop one first`);
          return;
        }
        addInput.value = '';
        try {
          const created = await createTaskRow({ title: v, status: 'focus', context: c, source: 'Manual' });
          state.tasks.unshift(created);
          afterMutation();   // re-renders the Focus view
          recordUndo({
            label: `add "${truncate(created.title)}"`,
            undo: () => deleteTask(created.id),
            redo: () => restoreTask(created),
          });
          const inp = document.getElementById('focus-add-input');
          if (inp) inp.focus();
        } catch (err) {
          alert('Could not add task: ' + err.message);
        }
      });
    }
  }

  function reorderFocus(draggedId, targetId, insertAbove, targetEffort) {
    const dragged = state.tasks.find(t => t.id === draggedId);
    if (!dragged) return;

    let arr = state.focusOrder.filter(x => x !== draggedId);
    if (targetId == null) {
      arr.push(draggedId);
    } else {
      const idx = arr.indexOf(targetId);
      if (idx === -1) arr.push(draggedId);
      else arr.splice(insertAbove ? idx : idx + 1, 0, draggedId);
    }
    state.focusOrder = arr;
    saveFocusOrder();

    const currentEffort = ['S','M','L','XL'].includes(dragged.effort) ? dragged.effort : null;
    if (targetEffort !== currentEffort) {
      patchTask(draggedId, { effort: targetEffort });
    } else {
      renderFocus();
    }
  }

  function renderCard(task) {
    const el = document.createElement("article");
    el.className = "card";
    if (state.filter.needsEffort) el.classList.add("needs-effort");
    el.draggable = true;
    el.dataset.id = task.id;
    const badges = [];
    if (task.context) {
      badges.push(`<span class="badge context-${task.context}">${task.context}</span>`);
    }
    if (task.source && task.source !== "Manual") {
      const link = task.sourceLink
        ? `<a href="${escapeHtml(task.sourceLink)}" target="_blank" rel="noopener" class="badge" title="Open source">${task.source}↗</a>`
        : `<span class="badge">${task.source}</span>`;
      badges.push(link);
    }
    const st = stalenessOf(task);
    if (st) {
      badges.push(`<span class="badge staleness stale-${st.level}">${escapeHtml(st.label)}</span>`);
    }
    if (task.timing) {
      const label = TIMING_LABEL[task.timing] || task.timing;
      badges.push(`<span class="badge timing timing-${task.timing}">${escapeHtml(label)}</span>`);
    }
    if (task.effort) {
      badges.push(`<span class="badge effort effort-${task.effort}">${escapeHtml(task.effort)}</span>`);
    } else if (state.filter.needsEffort && !isProject(task)) {
      // One-click tagging in the needs-effort view: tap a size to set it inline.
      badges.push(`<span class="effort-pick">${['S','M','L','XL']
        .map(e => `<button class="effort-opt" data-set-effort="${e}" title="Set effort ${e}">${e}</button>`).join('')}</span>`);
    }
    if (isProject(task)) {
      const { done, total } = projectProgress(task.id);
      const complete = done === total ? "complete" : "";
      const pts = projectEffortPoints(task.id);
      badges.push(`<button class="badge project-chip ${complete}" data-open-project title="Open project">📁 ${done}/${total}${pts ? ` · ${pts}p` : ''}</button>`);
    } else if (task.subtasks && task.subtasks.length) {
      const done = task.subtasks.filter(s => s.done).length;
      const total = task.subtasks.length;
      const complete = done === total ? "complete" : "";
      badges.push(`<span class="badge subtasks-chip ${complete}">✓ ${done}/${total}</span>`);
    }
    if (task.status === "done" && task.completedAt) {
      badges.push(`<span class="badge completed-chip" title="Completed ${escapeHtml(formatFullDate(task.completedAt))}">✓ Done ${escapeHtml(formatShortDate(task.completedAt))}</span>`);
    }
    const noteSummary = descriptionSummary(task.description || '');
    el.innerHTML = `
      <button class="del" title="Delete">×</button>
      <div class="title" tabindex="0">${escapeHtml(task.title)}</div>
      ${noteSummary
        ? `<div class="card-note">${escapeHtml(noteSummary)}</div>`
        : `<button class="card-context-action" data-add-context>+ Add context</button>`}
      ${badges.length ? `<div class="badges">${badges.join("")}</div>` : ""}
      <div class="meta"><span class="meta-created" title="Created ${escapeHtml(formatFullDate(task.createdAt))}">Created ${escapeHtml(formatShortDate(task.createdAt))}</span><span>${formatDate(task.updatedAt)}</span></div>
    `;
    el.addEventListener("click", (e) => {
      if (e.target.closest(".del")) return;
      if (e.target.closest("[data-add-context]")) {
        e.stopPropagation();
        openDrawer(task.id, { editDescription: true });
        return;
      }
      const ep = e.target.closest("[data-set-effort]");
      if (ep) { e.stopPropagation(); patchTask(task.id, { effort: ep.dataset.setEffort }); return; }
      if (e.target.closest("[data-open-project]")) {
        state.project = task.id;
        applyView();
        return;
      }
      openDrawer(task.id);
    });

    el.querySelector(".del").addEventListener("click", (e) => {
      e.stopPropagation();
      deleteTask(task.id);
    });

    el.addEventListener("dragstart", (e) => {
      e.dataTransfer.setData("text/plain", task.id);
      e.dataTransfer.effectAllowed = "move";
      el.classList.add("dragging");
    });
    el.addEventListener("dragend", () => el.classList.remove("dragging"));
    el.addEventListener("mousedown", () => focusCard(task.id, { scroll: false }));
    return el;
  }

  // === Drawer ===
  let drawerTaskId = null;
  let descSaveTimer = null;

  if (window.marked) window.marked.use({ gfm: true, breaks: true });
  function renderMarkdown(text) {
    if (!text || !text.trim()) return "";
    const raw = window.marked.parse(text);
    const clean = window.DOMPurify
      ? window.DOMPurify.sanitize(raw, { ADD_ATTR: ['target', 'rel'] })
      : raw;
    const div = document.createElement('div');
    div.innerHTML = clean;
    div.querySelectorAll('a').forEach(a => {
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
    });
    return div.innerHTML;
  }

  function renderDescriptionView(text) {
    const view = document.getElementById('drawer-description-view');
    if (!text || !text.trim()) {
      view.classList.add('empty');
      view.textContent = "Notes, context, links… (markdown supported)";
    } else {
      view.classList.remove('empty');
      view.innerHTML = renderMarkdown(text);
    }
  }

  function descriptionSummary(text) {
    return (text || '')
      .replace(/\[([^\]]+)\]\([^\)]+\)/g, '$1')
      .replace(/[#>*_`~\-]+/g, ' ')
      .replace(/\s+/g, ' ')
      .trim();
  }

  function autoResizeTextarea(el) {
    el.style.height = 'auto';
    el.style.height = Math.max(120, el.scrollHeight) + 'px';
  }

  function buildSubtaskRow(child) {
    const row = document.createElement('div');
    row.className = 'subtask-row' + (child.status === 'done' ? ' done' : '');
    row.dataset.childId = child.id;
    const eff = child.effort || '';
    row.innerHTML = `
      <input type="checkbox" ${child.status === 'done' ? 'checked' : ''} title="Mark done" />
      <input type="text" value="${escapeHtml(child.title)}" placeholder="Subtask…" />
      <select class="subtask-effort" title="Effort">
        ${['', 'S', 'M', 'L', 'XL'].map(v => `<option value="${v}" ${v === eff ? 'selected' : ''}>${v || '·'}</option>`).join('')}
      </select>
      <button class="subtask-open" title="Open as its own task">↗</button>
      <button class="del" title="Remove">×</button>
    `;
    return row;
  }

  // Subtasks are now real child tasks (2-level project -> task hierarchy).
  function renderSubtasks() {
    const task = state.tasks.find(t => t.id === drawerTaskId);
    if (!task) return;
    const list = document.getElementById('subtasks-list');
    list.innerHTML = "";
    childrenOf(task.id)
      .slice()
      .sort((a, b) => (a.createdAt || '').localeCompare(b.createdAt || ''))
      .forEach(c => list.appendChild(buildSubtaskRow(c)));
    updateSubtasksProgress();
  }

  // Decide which hierarchy controls show for the drawer's task, and fill the project picker.
  function renderDrawerHierarchy() {
    const task = state.tasks.find(t => t.id === drawerTaskId);
    if (!task) return;
    const isChild = !!task.parentId;
    const hasKids = childrenOf(task.id).length > 0;
    // A project (has children) can't itself be nested; a child can't have its own subtasks.
    document.getElementById('drawer-parent-row').hidden = hasKids;
    document.getElementById('subtasks-section').hidden = isChild;
    // Effort lives on leaf tasks; a project shows the rolled-up total instead.
    document.getElementById('drawer-effort-row').hidden = hasKids;
    const rollupRow = document.getElementById('drawer-effort-rollup');
    rollupRow.hidden = !hasKids;
    if (hasKids) {
      rollupRow.querySelector('.effort-rollup-val').textContent =
        `Σ ${projectEffortPoints(task.id)} pts (from subtasks)`;
    }
    const sel = document.getElementById('drawer-parent');
    const opts = ['<option value="">— No project</option>'];
    // Only offer projects in the same context (a Work task nests under Work projects).
    // If the task has no context yet, show all so the picker isn't empty.
    state.tasks
      .filter(t => !t.parentId && t.id !== task.id && !t.archived
                && (t.id === task.parentId
                    || ((!task.context || t.context === task.context) && !isComplete(t))))
      .sort((a, b) => (a.title || '').localeCompare(b.title || ''))
      .forEach(t => opts.push(`<option value="${t.id}">${escapeHtml(t.title)}</option>`));
    sel.innerHTML = opts.join("");
    sel.value = task.parentId || "";
  }

  function renderTimestamps() {
    const task = state.tasks.find(t => t.id === drawerTaskId);
    const el = document.getElementById('drawer-timestamps');
    if (!task) { el.innerHTML = ""; return; }
    const rows = [];
    if (task.createdAt) {
      const st = stalenessOf(task);
      const age = st
        ? `<span class="ts-age stale-${st.level}">${escapeHtml(st.label)}</span>`
        : "";
      // Projects have no staleness, so no age tag and no reset control for them.
      const reset = st !== null || !isProject(task)
        ? `<button class="ts-reset" id="reset-staleness" title="Reset staleness — set Created to now">↻ Reset</button>`
        : "";
      rows.push(`<div class="ts-row ts-created">
        <span class="ts-label">Created</span>
        <span class="ts-created-val">${escapeHtml(formatFullDate(task.createdAt))} ${age}</span>
        ${reset}
      </div>`);
    }
    if (task.completedAt) {
      rows.push(`<div class="ts-row"><span class="ts-label">Completed</span><span>${escapeHtml(formatFullDate(task.completedAt))}</span></div>`);
    }
    el.innerHTML = rows.join("");
    const resetBtn = document.getElementById('reset-staleness');
    if (resetBtn) {
      resetBtn.addEventListener('click', () => {
        patchTask(task.id, { createdAt: now() });
      });
    }
  }

  function updateSubtasksProgress() {
    const task = state.tasks.find(t => t.id === drawerTaskId);
    if (!task) return;
    const kids = childrenOf(task.id);
    const el = document.getElementById('subtasks-progress');
    el.textContent = kids.length
      ? `${kids.filter(c => c.status === 'done').length}/${kids.length}`
      : "";
  }

  function setDescriptionMode(mode) {
    const textarea = document.getElementById('drawer-description');
    const view = document.getElementById('drawer-description-view');
    const button = document.getElementById('notes-mode');
    const previewing = mode === 'preview';
    textarea.hidden = previewing;
    view.hidden = !previewing;
    button.textContent = previewing ? 'Edit' : 'Preview';
    if (previewing) renderDescriptionView(textarea.value);
  }

  async function flushDescriptionSave() {
    if (descSaveTimer) {
      clearTimeout(descSaveTimer);
      descSaveTimer = null;
    }
    if (!drawerTaskId) return;
    const taskId = drawerTaskId;
    const textarea = document.getElementById('drawer-description');
    const saveState = document.getElementById('notes-save-state');
    const task = state.tasks.find(t => t.id === taskId);
    if (!task) return;
    const next = textarea.value.trim() === '' ? null : textarea.value;
    const current = task.description || null;
    if (next === current) {
      saveState.textContent = '';
      return;
    }
    saveState.textContent = 'Saving…';
    await patchTask(taskId, { description: next });
    if (drawerTaskId === taskId) saveState.textContent = 'Saved';
  }

  function openDrawer(taskId, options = {}) {
    const task = state.tasks.find(t => t.id === taskId);
    if (!task) return;
    if (drawerTaskId && drawerTaskId !== taskId) flushDescriptionSave();
    drawerTaskId = taskId;
    document.getElementById('drawer-title').value = task.title || '';
    document.getElementById('drawer-status').value = task.status || 'inbox';
    document.getElementById('drawer-context').value = task.context || '';
    document.getElementById('drawer-timing').value = task.timing || '';
    document.getElementById('drawer-effort').value = task.effort || '';
    document.getElementById('drawer-source-link').value = task.sourceLink || '';

    const descTextarea = document.getElementById('drawer-description');
    descTextarea.value = task.description || '';
    document.getElementById('notes-save-state').textContent = '';
    setDescriptionMode('write');
    renderDescriptionView(task.description || '');

    renderDrawerHierarchy();
    renderSubtasks();
    renderTimestamps();

    document.getElementById('drawer-backdrop').dataset.open = 'true';
    document.getElementById('drawer').setAttribute('aria-hidden', 'false');
    setTimeout(() => {
      const target = options.editDescription ? descTextarea : document.getElementById('drawer-title');
      target.focus();
      if (options.editDescription) {
        const len = descTextarea.value.length;
        descTextarea.setSelectionRange(len, len);
      }
    }, 50);
  }

  function closeDrawer() {
    flushDescriptionSave();
    drawerTaskId = null;
    document.getElementById('drawer-backdrop').dataset.open = 'false';
    document.getElementById('drawer').setAttribute('aria-hidden', 'true');
  }

  function setupDrawer() {
    const fields = [
      ['drawer-title', 'title', 'blur'],
      ['drawer-status', 'status', 'change'],
      ['drawer-context', 'context', 'change'],
      ['drawer-timing', 'timing', 'change'],
      ['drawer-effort', 'effort', 'change'],
      ['drawer-source-link', 'sourceLink', 'blur'],
    ];
    for (const [elId, fieldKey, evt] of fields) {
      const el = document.getElementById(elId);
      el.addEventListener(evt, () => {
        if (!drawerTaskId) return;
        const task = state.tasks.find(t => t.id === drawerTaskId);
        if (!task) return;
        const raw = el.value;
        const next = raw === '' ? null : raw;
        const current = task[fieldKey] || null;
        if (next === current) return;
        patchTask(drawerTaskId, { [fieldKey]: next });
      });
    }

    // Context & notes: write by default, with an optional rendered preview.
    const descTextarea = document.getElementById('drawer-description');
    const descView = document.getElementById('drawer-description-view');
    descView.addEventListener('click', (e) => {
      if (e.target.closest('a')) return;
      if (!drawerTaskId) return;
      setDescriptionMode('write');
      autoResizeTextarea(descTextarea);
      descTextarea.focus();
      const len = descTextarea.value.length;
      descTextarea.setSelectionRange(len, len);
    });
    descTextarea.addEventListener('input', () => {
      autoResizeTextarea(descTextarea);
      document.getElementById('notes-save-state').textContent = 'Unsaved';
      if (descSaveTimer) clearTimeout(descSaveTimer);
      descSaveTimer = setTimeout(flushDescriptionSave, 700);
    });
    descTextarea.addEventListener('blur', flushDescriptionSave);
    document.getElementById('notes-mode').addEventListener('click', async () => {
      if (descTextarea.hidden) {
        setDescriptionMode('write');
        autoResizeTextarea(descTextarea);
        descTextarea.focus();
      } else {
        await flushDescriptionSave();
        setDescriptionMode('preview');
      }
    });

    // Project (parent) picker
    document.getElementById('drawer-parent').addEventListener('change', (e) => {
      if (!drawerTaskId) return;
      const task = state.tasks.find(t => t.id === drawerTaskId);
      if (!task) return;
      const next = e.target.value || null;
      if (next === (task.parentId || null)) return;
      patchTask(drawerTaskId, { parentId: next });
      renderDrawerHierarchy();
    });

    // Subtasks (backed by real child tasks)
    const list = document.getElementById('subtasks-list');
    list.addEventListener('change', (e) => {
      if (!drawerTaskId) return;
      const row = e.target.closest('.subtask-row');
      if (!row) return;
      const childId = row.dataset.childId;
      if (e.target.classList.contains('subtask-effort')) {
        patchTask(childId, { effort: e.target.value || null });
        return;
      }
      if (e.target.type !== 'checkbox') return;
      const done = e.target.checked;
      patchTask(childId, { status: done ? 'done' : 'not-started' });
      row.classList.toggle('done', done);
      updateSubtasksProgress();
    });
    list.addEventListener('focusout', (e) => {
      if (!drawerTaskId) return;
      const inp = e.target;
      if (inp.tagName !== 'INPUT' || inp.type !== 'text') return;
      const row = inp.closest('.subtask-row');
      const child = state.tasks.find(t => t.id === row.dataset.childId);
      if (!child) return;
      const title = inp.value.trim();
      if (title === (child.title || '')) return;
      patchTask(child.id, { title });
    });
    list.addEventListener('keydown', (e) => {
      if (e.key !== 'Enter') return;
      const row = e.target.closest('.subtask-row');
      if (!row) return;
      if (e.target.tagName === 'INPUT' && e.target.type === 'text') {
        // Title entered → jump to this row's effort picker instead of adding the next.
        e.preventDefault();
        e.target.blur();   // saves the title via focusout
        const sel = row.querySelector('.subtask-effort');
        if (sel) sel.focus();
      } else if (e.target.classList.contains('subtask-effort')) {
        // Effort set → commit it and add the next subtask.
        e.preventDefault();
        patchTask(row.dataset.childId, { effort: e.target.value || null });
        addSubtask();
      }
    });
    list.addEventListener('click', (e) => {
      if (!drawerTaskId) return;
      const open = e.target.closest('.subtask-open');
      if (open) {
        const row = open.closest('.subtask-row');
        openDrawer(row.dataset.childId);   // drill into the child as its own task
        return;
      }
      const del = e.target.closest('.del');
      if (!del) return;
      const row = del.closest('.subtask-row');
      deleteTask(row.dataset.childId);
      renderDrawerHierarchy();
      renderSubtasks();
    });
    document.getElementById('subtask-add').addEventListener('click', addSubtask);

    document.getElementById('drawer-close').addEventListener('click', closeDrawer);
    document.getElementById('drawer-expand').addEventListener('click', toggleDrawerExpand);
    document.getElementById('drawer-backdrop').addEventListener('click', (e) => {
      if (e.target.id === 'drawer-backdrop') closeDrawer();
    });
  }

  function toggleDrawerExpand() {
    const drawer = document.getElementById('drawer');
    const expanded = drawer.classList.toggle('expanded');
    const btn = document.getElementById('drawer-expand');
    btn.textContent = expanded ? '⤡' : '⤢';
    btn.title = expanded ? 'Collapse (E)' : 'Expand — full-screen room for notes (E)';
    // If the description editor is open, re-fit it to the new height.
    const ta = document.getElementById('drawer-description');
    if (ta && !ta.hidden) autoResizeTextarea(ta);
  }

  async function addSubtask() {
    if (!drawerTaskId) return;
    const task = state.tasks.find(t => t.id === drawerTaskId);
    if (!task) return;
    if (task.parentId) return;   // a child task can't have its own subtasks (2-level only)
    const parentId = task.id;
    try {
      const created = await createTaskRow({
        title: '', status: 'not-started',
        context: task.context || 'Personal', source: 'Manual', parentId,
      });
      state.tasks.unshift(created);
      // Effort now lives on the subtasks; clear the parent's own effort so it doesn't double-count.
      if (task.effort) patchTask(parentId, { effort: null });
      afterMutation();              // refresh board + sidebar progress
      if (drawerTaskId !== parentId) return;   // drawer moved on while awaiting
      renderDrawerHierarchy();      // standalone task just became a project
      renderSubtasks();
      const list = document.getElementById('subtasks-list');
      const row = list.querySelector(`.subtask-row[data-child-id="${CSS.escape(created.id)}"]`);
      if (row) row.querySelector('input[type="text"]').focus();
    } catch (e) {
      alert("Could not add subtask: " + e.message);
    }
  }

  function openNewInput(status, colEl) {
    const existing = colEl.querySelector(".new-input");
    if (existing) { existing.querySelector("textarea").focus(); return; }

    const addBtn = colEl.querySelector(".add");
    const wrap = document.createElement("div");
    wrap.className = "new-input";
    wrap.innerHTML = `
      <textarea placeholder="Task title… (Enter to add, Esc to cancel)"></textarea>
      <div class="row">
        <button data-cancel>Cancel</button>
        <button data-add-confirm>Add</button>
      </div>
    `;
    addBtn.replaceWith(wrap);
    const ta = wrap.querySelector("textarea");
    ta.focus();

    const cancel = () => render();
    const confirm = async () => {
      const v = ta.value.trim();
      if (!v) return cancel();
      const proj = state.project ? projectById(state.project) : null;
      const ctx = proj && proj.context
        ? proj.context
        : (state.filter.context === "Work" ? "Work" : "Personal");
      const timing = (state.filter.timing && state.filter.timing !== "all") ? state.filter.timing : undefined;
      const parentId = state.project || undefined;
      ta.disabled = true;
      try {
        const created = await createTaskRow({ title: v, status, context: ctx, source: "Manual", timing, parentId });
        state.tasks.unshift(created);
        render();
        recordUndo({
          label: `add "${truncate(created.title)}"`,
          undo: () => deleteTask(created.id),
          redo: () => restoreTask(created),
        });
      } catch (e) {
        ta.disabled = false;
        alert("Could not add task: " + e.message);
      }
    };

    wrap.querySelector("[data-cancel]").addEventListener("click", cancel);
    wrap.querySelector("[data-add-confirm]").addEventListener("click", confirm);
    ta.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); confirm(); }
      if (e.key === "Escape") { e.preventDefault(); cancel(); }
    });
  }

  function escapeHtml(s) {
    return s.replace(/[&<>"']/g, c => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
    }[c]));
  }
  function formatDate(iso) {
    const d = new Date(iso);
    const today = new Date();
    const sameDay = d.toDateString() === today.toDateString();
    if (sameDay) return d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" });
    return d.toLocaleDateString([], { month: "short", day: "numeric" });
  }
  function formatShortDate(iso) {
    return new Date(iso).toLocaleDateString([], { month: "short", day: "numeric" });
  }
  function formatFullDate(iso) {
    return new Date(iso).toLocaleString([], { month: "short", day: "numeric", year: "numeric", hour: "numeric", minute: "2-digit" });
  }

  // === Stats ===
  function startOfWeek(d) {
    // Monday-anchored week, local time
    const x = new Date(d);
    x.setHours(0, 0, 0, 0);
    const day = x.getDay(); // 0=Sun..6=Sat
    const diff = (day === 0 ? -6 : 1 - day); // back to Monday
    x.setDate(x.getDate() + diff);
    return x;
  }
  function addDays(d, n) { const x = new Date(d); x.setDate(x.getDate() + n); return x; }
  function formatWeekRange(weekStart) {
    const end = addDays(weekStart, 6);
    const sameMonth = weekStart.getMonth() === end.getMonth();
    const fmt = (d) => d.toLocaleDateString([], { month: "short", day: "numeric" });
    return sameMonth
      ? `${weekStart.toLocaleDateString([], { month: "short" })} ${weekStart.getDate()}–${end.getDate()}`
      : `${fmt(weekStart)} – ${fmt(end)}`;
  }
  function effortPoints(effort) { return POINTS[effort] || 0; }

  function workTasksCompletedInRange(start, end) {
    return state.tasks.filter(t => {
      if (t.context !== "Work") return false;
      if (!t.completedAt) return false;
      const c = new Date(t.completedAt);
      return c >= start && c < end;
    });
  }

  const WEEKDAY_LABELS = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

  function weekdayAverages() {
    const currentStart = startOfWeek(new Date());
    const points = [0,0,0,0,0,0,0];
    const counts = [0,0,0,0,0,0,0];
    const N = HISTORY_WEEKS - 1; // exclude current (in-progress) week
    for (let i = 1; i <= N; i++) {
      const start = addDays(currentStart, -7 * i);
      const end   = addDays(start, 7);
      for (const t of workTasksCompletedInRange(start, end)) {
        const d = new Date(t.completedAt);
        const idx = (d.getDay() + 6) % 7; // Mon=0..Sun=6
        counts[idx] += 1;
        points[idx] += effortPoints(t.effort);
      }
    }
    return {
      pointsAvg: points.map(p => p / N),
      countAvg:  counts.map(c => c / N),
      weeksObserved: N,
    };
  }

  function summarize(tasks) {
    const byEffort = { S: 0, M: 0, L: 0, XL: 0, untagged: 0 };
    let points = 0;
    for (const t of tasks) {
      if (t.effort && byEffort.hasOwnProperty(t.effort)) {
        byEffort[t.effort]++;
        points += effortPoints(t.effort);
      } else {
        byEffort.untagged++;
      }
    }
    return { count: tasks.length, points, byEffort };
  }

  function untaggedWorkOpenCount() {
    // Projects don't carry their own effort (it rolls up from subtasks via
    // projectEffortPoints), so they're never "untagged" — only real leaf tasks count.
    return state.tasks.filter(t => t.context === "Work" && t.status !== "done" && !t.effort && !isProject(t)).length;
  }

  function renderStatsStrip() {
    const el = document.getElementById('stats-strip');
    if (!el || el.hidden) return;
    const ws = startOfWeek(new Date());
    const we = addDays(ws, 7);
    const tasks = workTasksCompletedInRange(ws, we);
    const s = summarize(tasks);
    const breakdownParts = ["S", "M", "L", "XL"]
      .filter(k => s.byEffort[k] > 0)
      .map(k => `<span>${k}:${s.byEffort[k]}</span>`);
    if (s.byEffort.untagged > 0) breakdownParts.push(`<span>?:${s.byEffort.untagged}</span>`);
    const untagged = untaggedWorkOpenCount();
    const isFilter = state.filter.needsEffort;
    const untaggedHtml = untagged > 0
      ? `<button class="untagged ${isFilter ? 'active' : ''}" id="untagged-pill">${isFilter ? `Showing ${untagged} untagged · clear` : `⚠ ${untagged} untagged`}</button>`
      : `<span class="untagged zero">All work tasks tagged ✓</span>`;
    el.innerHTML = `
      <span class="stat"><span>This week (Work):</span> <strong>${s.count}</strong> done</span>
      <span class="stat-sep">·</span>
      <span class="stat"><span class="points">${s.points}</span> pts</span>
      ${breakdownParts.length ? `<span class="stat-sep">·</span><span class="breakdown">${breakdownParts.join("")}</span>` : ""}
      ${untaggedHtml}
    `;
    const pill = document.getElementById('untagged-pill');
    if (pill) {
      pill.addEventListener('click', () => {
        state.filter.needsEffort = !state.filter.needsEffort;
        renderStatsStrip();
        render();
      });
    }
  }

  function renderStatsPage() {
    const el = document.getElementById('stats-page');
    // Bind the inline effort-chip handler once (delegation survives re-renders).
    if (!el.dataset.effortBound) {
      el.dataset.effortBound = '1';
      el.addEventListener('click', (e) => {
        const ep = e.target.closest('[data-set-effort]');
        if (ep) patchTask(ep.dataset.task, { effort: ep.dataset.setEffort });
      });
    }
    const today = new Date();
    const currentStart = startOfWeek(today);
    // End-of-week nudge: tasks completed THIS week with no effort tagged (skip projects).
    const doneUntagged = workTasksCompletedInRange(currentStart, addDays(currentStart, 7))
      .filter(t => !t.effort && !isProject(t));
    const eowHtml = doneUntagged.length ? `
        <div class="stats-section eow-untagged">
          <h3>🔻 Done this week · no effort <span class="section-sub">tap a size to tag — keeps weekly points honest</span></h3>
          <ul class="eow-list">
            ${doneUntagged.map(t => `
              <li class="eow-row">
                <span class="eow-title">${escapeHtml(t.title) || '<em>Untitled</em>'}</span>
                <span class="effort-pick">${['S','M','L','XL']
                  .map(e => `<button class="effort-opt" data-set-effort="${e}" data-task="${escapeHtml(t.id)}" title="Set effort ${e}">${e}</button>`).join('')}</span>
              </li>`).join('')}
          </ul>
        </div>` : '';
    const weeks = [];
    for (let i = 0; i < HISTORY_WEEKS; i++) {
      const start = addDays(currentStart, -7 * i);
      const end = addDays(start, 7);
      const tasks = workTasksCompletedInRange(start, end);
      weeks.push({ start, end, ...summarize(tasks) });
    }

    const current = weeks[0];
    const prior = weeks.slice(1).filter(w => w.count > 0);
    const avgPoints = prior.length ? (prior.reduce((a, w) => a + w.points, 0) / prior.length) : 0;
    const avgCount = prior.length ? (prior.reduce((a, w) => a + w.count, 0) / prior.length) : 0;
    const bestWeek = weeks.reduce((b, w) => w.points > b.points ? w : b, weeks[0]);

    const maxPoints = Math.max(1, ...weeks.map(w => w.points));
    const chartWeeks = [...weeks].reverse(); // oldest → newest
    const chartHtml = chartWeeks.map(w => {
      const h = (w.points / maxPoints) * 100;
      const isCurrent = w.start.getTime() === currentStart.getTime();
      const label = `${w.start.toLocaleDateString([], { month: "numeric", day: "numeric" })}`;
      return `
        <div class="bar-col" title="${formatWeekRange(w.start)} · ${w.count} done · ${w.points} pts">
          <div class="bar-value">${w.points || ""}</div>
          <div class="bar-wrap"><div class="bar ${isCurrent ? 'current' : ''}" style="height:${h}%"></div></div>
          <div class="x-label">${label}</div>
        </div>
      `;
    }).join("");

    const wd = weekdayAverages();
    const maxDayPoints = Math.max(0.001, ...wd.pointsAvg);
    const maxDayCount  = Math.max(0.001, ...wd.countAvg);
    const bestPointsDay = wd.pointsAvg.indexOf(Math.max(...wd.pointsAvg));
    const bestCountDay  = wd.countAvg.indexOf(Math.max(...wd.countAvg));
    const pointsByDayHtml = WEEKDAY_LABELS.map((label, i) => {
      const v = wd.pointsAvg[i];
      const h = (v / maxDayPoints) * 100;
      const isBest = i === bestPointsDay && v > 0;
      const display = v >= 10 ? v.toFixed(0) : v.toFixed(1);
      return `
        <div class="bar-col" title="${label} · avg ${display} pts">
          <div class="bar-value">${v > 0 ? display : ""}</div>
          <div class="bar-wrap"><div class="bar ${isBest ? 'current' : ''}" style="height:${h}%"></div></div>
          <div class="x-label">${label}</div>
        </div>
      `;
    }).join("");
    const countByDayHtml = WEEKDAY_LABELS.map((label, i) => {
      const v = wd.countAvg[i];
      const h = (v / maxDayCount) * 100;
      const isBest = i === bestCountDay && v > 0;
      const display = v >= 10 ? v.toFixed(0) : v.toFixed(1);
      return `
        <div class="bar-col" title="${label} · avg ${display} tasks">
          <div class="bar-value">${v > 0 ? display : ""}</div>
          <div class="bar-wrap"><div class="bar ${isBest ? 'current' : ''}" style="height:${h}%"></div></div>
          <div class="x-label">${label}</div>
        </div>
      `;
    }).join("");

    const rowsHtml = weeks.map(w => {
      const breakdown = ["S", "M", "L", "XL"]
        .filter(k => w.byEffort[k] > 0)
        .map(k => `${k}:${w.byEffort[k]}`).join(" · ");
      const untagged = w.byEffort.untagged > 0 ? ` <span style="color:#92400e">(?: ${w.byEffort.untagged})</span>` : "";
      const isCurrent = w.start.getTime() === currentStart.getTime();
      return `
        <tr class="${isCurrent ? 'current-week' : ''}">
          <td>${formatWeekRange(w.start)}${isCurrent ? " (this week)" : ""}</td>
          <td class="num">${w.count}</td>
          <td class="num"><span class="points">${w.points}</span></td>
          <td><span class="breakdown">${breakdown || "—"}${untagged}</span></td>
        </tr>
      `;
    }).join("");

    el.innerHTML = `
      <div class="stats-page-inner">
        <h2>Work Productivity</h2>
        <p class="subtitle">Throughput by completion date. 1pt = S, 2pt = M, 5pt = L, 10pt = XL.</p>

        <div class="summary-cards">
          <div class="summary-card">
            <div class="label">This week</div>
            <div class="value"><span class="points" style="color:var(--accent)">${current.points}</span> pts</div>
            <div class="sub">${current.count} task${current.count === 1 ? "" : "s"} done</div>
          </div>
          <div class="summary-card">
            <div class="label">${prior.length}-week average</div>
            <div class="value">${avgPoints.toFixed(1)} pts</div>
            <div class="sub">${avgCount.toFixed(1)} tasks / week</div>
          </div>
          <div class="summary-card">
            <div class="label">Best week (last ${HISTORY_WEEKS})</div>
            <div class="value">${bestWeek.points} pts</div>
            <div class="sub">${formatWeekRange(bestWeek.start)}</div>
          </div>
          <div class="summary-card">
            <div class="label">Untagged (open)</div>
            <div class="value" style="color:${untaggedWorkOpenCount() > 0 ? '#f59e0b' : 'inherit'}">${untaggedWorkOpenCount()}</div>
            <div class="sub">work tasks missing effort</div>
          </div>
        </div>
        ${eowHtml}
        <div class="stats-section">
          <h3>Points per week</h3>
          <div class="points-chart">${chartHtml}</div>
        </div>

        <div class="stats-section">
          <h3>By day of week <span class="section-sub">avg over last ${wd.weeksObserved} weeks (current week excluded)</span></h3>
          <div class="weekday-grid">
            <div>
              <div class="chart-label">Points / day</div>
              <div class="points-chart">${pointsByDayHtml}</div>
            </div>
            <div>
              <div class="chart-label">Tasks / day</div>
              <div class="points-chart">${countByDayHtml}</div>
            </div>
          </div>
        </div>

        <div class="stats-section">
          <h3>Weekly breakdown</h3>
          <table class="weeks-table">
            <thead><tr><th>Week</th><th class="num">Done</th><th class="num">Points</th><th>Breakdown</th></tr></thead>
            <tbody>${rowsHtml}</tbody>
          </table>
        </div>
      </div>
    `;
  }

  // === Personal Stats (Journal BI) ===
  let _journalData = null;
  let _journalFetch = null;
  let _biPeriod = 'week';
  const STRENGTH_TARGET = 120; // minutes of strength work per week

  function fetchJournal() {
    if (_journalData) return Promise.resolve(_journalData);
    if (!_journalFetch) {
      _journalFetch = supabase
        .from('journal_entries')
        .select('*')
        .order('week', { ascending: true })
        .then(({ data, error }) => {
          if (error) throw error;
          _journalData = (data || []).filter(e => e.week);
          return _journalData;
        })
        .catch(() => { _journalFetch = null; return null; });
    }
    return _journalFetch;
  }

  async function renderPersonalStatsPage() {
    const el = document.getElementById('personal-stats-page');
    if (!_journalData) {
      el.innerHTML = `<div class="stats-page-inner" style="padding-top:60px;text-align:center;color:var(--muted);font-size:14px">Loading…</div>`;
    }

    const entries = await fetchJournal();
    if (state.view !== 'personal-stats') return;

    if (!entries) {
      el.innerHTML = `<div class="stats-page-inner"><p style="margin-top:40px;color:var(--muted)">Could not load Personal Intelligence data from Supabase. Confirm the journal migration and latest sync completed successfully, then try again.</p></div>`;
      return;
    }

    const avgOf = (arr, key) => { const v = arr.map(e => e[key]).filter(v => v != null); return v.length ? v.reduce((a,b) => a+b, 0) / v.length : null; };
    const sumOf = (arr, key) => { const v = arr.map(e => e[key]).filter(v => v != null); return v.length ? v.reduce((a,b) => a+b, 0) : null; };
    const fmtInt = v => v == null ? '—' : Math.round(v).toString();
    const fmt1   = v => v == null ? '—' : (+v).toFixed(1);
    const parseLocalDate = value => new Date(`${value}T00:00:00`);
    const getLabel = e => e._label || (() => { const d = parseLocalDate(e.week); return `${d.getMonth()+1}/${d.getDate()}`; })();

    // Build aggregated data for selected period
    function buildPeriodData() {
      if (_biPeriod === 'week') return entries.slice(-16);

      const map = {};
      for (const e of entries) {
        const d = parseLocalDate(e.week);
        let k, label;
        if (_biPeriod === 'month') {
          const mo = d.getMonth();
          k = `${d.getFullYear()}-${String(mo+1).padStart(2,'0')}`;
          const name = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'][mo];
          label = `${name} '${String(d.getFullYear()).slice(2)}`;
        } else {
          const q = Math.floor(d.getMonth()/3)+1;
          k = `${d.getFullYear()}-Q${q}`;
          label = `Q${q} '${String(d.getFullYear()).slice(2)}`;
        }
        if (!map[k]) map[k] = { _label: label, _rows: [] };
        map[k]._rows.push(e);
      }
      const keys = Object.keys(map).sort();
      const slice = keys.slice(-12);
      return slice.map(k => {
        const rows = map[k]._rows;
        return {
          _label: map[k]._label,
          slp_score: avgOf(rows, 'slp_score'), slp_hrs: avgOf(rows, 'slp_hrs'),
          slp_hrv:   avgOf(rows, 'slp_hrv'),   rhr:      avgOf(rows, 'rhr'),
          training_hrs:   sumOf(rows, 'training_hrs'),
          intensity_mins: sumOf(rows, 'intensity_mins'),
          // Averaged, not summed, unlike its neighbours: the 120-minute goal is
          // per week, so a rolled-up period has to stay on that same scale for
          // the target line to mean anything.
          strength_mins:  avgOf(rows, 'strength_mins'),
          run_miles:  sumOf(rows, 'run_miles'), bike_miles: sumOf(rows, 'bike_miles'),
          weekly_weight: avgOf(rows, 'weekly_weight'), body_fat: avgOf(rows, 'body_fat'),
          stress:     avgOf(rows, 'stress'),    meditation: sumOf(rows, 'meditation'),
          articles:   sumOf(rows, 'articles'),  podcasts:   sumOf(rows, 'podcasts'),
          consumed_cals: avgOf(rows, 'consumed_cals'), garmin_tdee: avgOf(rows, 'garmin_tdee'),
          avg_protein: avgOf(rows, 'avg_protein'), calorie_deficit: avgOf(rows, 'calorie_deficit'),
        };
      });
    }

    function medianOf(data, key) {
      const v = data.map(e => e[key]).filter(n => n != null).sort((a,b) => a-b);
      if (!v.length) return null;
      return v.length % 2 ? v[(v.length-1)/2] : (v[v.length/2-1] + v[v.length/2]) / 2;
    }

    function trimEmptyEdges(data, key) {
      const first = data.findIndex(e => e[key] != null);
      if (first < 0) return [];
      let last = data.length - 1;
      while (last > first && data[last][key] == null) last--;
      return data.slice(first, last + 1);
    }

    function makeQuarterChart(data, key, color, valFmt, zeroBase = false, unit = '', target = null) {
      data = trimEmptyEdges(data, key);
      const points = data.map((e, i) => ({ v: e[key], i, label: getLabel(e) })).filter(p => p.v != null);
      if (!points.length) return `<div class="bi-empty-chart">No data for this period yet</div>`;
      // Bars always start at zero: their length *is* the value, so a truncated
      // axis would overstate the difference between quarters. (Lines may sit on
      // a zoomed axis — position, not length, carries their meaning.)
      const vals = points.map(p => p.v), rawMax = Math.max(...vals, target ?? -Infinity), rawMin = Math.min(0, ...vals);
      const min = rawMin, max = rawMax + Math.max((rawMax - rawMin) * .08, 1);
      const range = Math.max(.001, max - min), W = 640, H = 190, L = 38, R = target != null ? 62 : 10, T = 10, B = 28;
      const plotW = W-L-R, slot = plotW / Math.max(1, data.length), barW = Math.min(38, slot * .62);
      const y = v => T + (1 - (v-min)/range) * (H-T-B);
      const grid = [0,.5,1].map(frac => {
        const gy = T + frac*(H-T-B), gv = max-frac*range;
        return `<line class="bi-grid-line" x1="${L}" y1="${gy}" x2="${W-R}" y2="${gy}"></line><text class="bi-axis-label" x="${L-7}" y="${gy+3}" text-anchor="end">${valFmt(gv)}</text>`;
      }).join('');
      // Anchor every bar to the zero line, so a negative quarter (a calorie
      // surplus, say) grows downward instead of being drawn as a positive bar.
      const yZero = y(0);
      const zeroRule = rawMin < 0 ? `<line class="bi-grid-line" x1="${L}" y1="${yZero.toFixed(1)}" x2="${W-R}" y2="${yZero.toFixed(1)}"></line>` : '';
      const targetRule = target != null && target >= min && target <= max
        ? `<line class="bi-target" x1="${L}" y1="${y(target).toFixed(1)}" x2="${W-R}" y2="${y(target).toFixed(1)}"></line>
           <text class="bi-ref-label bi-target-label" x="${W-R+6}" y="${Math.max(T+7, y(target)+2.5).toFixed(1)}" text-anchor="start">goal ${valFmt(target)}</text>` : '';
      const bars = points.map(p => {
        const cx = L + (p.i+.5)*slot, vy = y(p.v);
        const top = Math.min(vy, yZero), height = Math.max(2, Math.abs(vy - yZero));
        const tooltip = escapeHtml(`${p.label}|${valFmt(p.v)}${unit ? ` ${unit}` : ''}`);
        return `<rect class="bi-quarter-bar" x="${cx-barW/2}" y="${top.toFixed(1)}" width="${barW}" height="${height.toFixed(1)}" rx="4" style="fill:${color}" data-tooltip="${tooltip}"><title>${escapeHtml(p.label)}: ${valFmt(p.v)}${unit ? ` ${unit}` : ''}</title></rect>`;
      }).join('');
      const labels = data.map((e,i) => i%2===0 || i===data.length-1 ? `<text class="bi-axis-label" x="${L+(i+.5)*slot}" y="${H-6}" text-anchor="middle">${escapeHtml(getLabel(e))}</text>` : '').join('');
      return `<svg class="bi-trend-chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="${escapeHtml(key.replaceAll('_',' '))} quarterly bars">${grid}${zeroRule}${targetRule}${bars}${labels}</svg>`;
    }

    function makeTrendChart(data, key, color, valFmt, zeroBase = false, unit = '', target = null) {
      if (_biPeriod === 'quarter') return makeQuarterChart(data, key, color, valFmt, zeroBase, unit, target);
      data = trimEmptyEdges(data, key);
      const points = data.map((e, i) => ({ v: e[key], i, label: getLabel(e) })).filter(p => p.v != null);
      if (points.length < 2) return `<div class="bi-empty-chart">Not enough data to chart yet</div>`;
      const vals = points.map(p => p.v);
      // The scale has to reach the target, or a goal you are short of sits off
      // the top of the plot — exactly the weeks where seeing it matters.
      const rawMin = Math.min(...vals, target ?? Infinity), rawMax = Math.max(...vals, target ?? -Infinity);
      const padding = zeroBase ? Math.max((rawMax - Math.min(0, rawMin)) * .08, 1) : Math.max((rawMax - rawMin) * .22, Math.abs(rawMax) * .025, 1);
      // Zero-basing must still make room for genuinely negative readings — a
      // calorie surplus is a real value, not something to clip off the plot —
      // but only when they exist. Padding below an all-positive series would
      // print an impossible floor like "-10 minutes" on the axis.
      const min = zeroBase ? (rawMin < 0 ? rawMin - padding : 0) : Math.max(0, rawMin - padding);
      const max = rawMax + padding;
      const range = Math.max(.001, max - min);
      // R leaves a gutter for the reference-line label. Naming it outside the
      // plot is the only placement that cannot collide with the line it labels.
      const W = 640, H = 190, L = 38, R = 62, T = 10, B = 28;
      const x = i => L + (i / Math.max(1, data.length - 1)) * (W - L - R);
      const y = v => T + (1 - (v - min) / range) * (H - T - B);
      // Split into runs of consecutive logged periods. Drawing one path through
      // every point would bridge unlogged stretches as if they were measured —
      // a three-month gap in the food log reads as a smooth climb otherwise.
      const segments = points.reduce((acc, p) => {
        const last = acc.at(-1);
        if (last && p.i === last.at(-1).i + 1) last.push(p); else acc.push([p]);
        return acc;
      }, []);
      const at = p => `${x(p.i).toFixed(1)},${y(p.v).toFixed(1)}`;
      const line = segments.filter(s => s.length > 1)
        .map(s => `<path class="bi-trend-line" d="M ${s.map(at).join(' L ')}" style="stroke:${color}"></path>`).join('');
      // Only fill under an unbroken run. Filling each fragment separately puts a
      // vertical cliff at every gap edge, which reads as a plunge to zero.
      const area = segments.length > 1 ? '' : segments.filter(s => s.length > 1)
        .map(s => `<path class="bi-trend-area" d="M ${s.map(at).join(' L ')} L ${x(s.at(-1).i).toFixed(1)},${H-B} L ${x(s[0].i).toFixed(1)},${H-B} Z" fill="url(#grad-${key}-${_biPeriod})"></path>`).join('');
      const gaps = segments.slice(1).map((s, idx) => {
